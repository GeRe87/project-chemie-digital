<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
 <title id="title">Additive analytical effects motivate a candidate normal model</title>
 <desc id="desc">Preparation, detector and readout each contribute small random deviations to one analytical result. Those deviations add. Many small non-dominant contributions under suitable conditions can motivate a normal approximation; the three illustrated stages do not prove it.</desc>
 <style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}.water{fill:#7ec7d5}.head{fill:#126c82}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}.head{fill:#7bd9e3}.water{fill:#42889c}}</style>
