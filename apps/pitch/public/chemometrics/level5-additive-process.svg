 <g class="ink" text-anchor="middle" font-size="25"><text x="1030" y="85">Candidate normal</text><text x="1030" y="116">result model</text><text x="1030" y="289">Possible results</text><text x="430" y="351">Small random contributions add to the result.</text><text x="600" y="409">Many non-dominant effects can motivate an approximation.</text><text x="600" y="442">Stability, dependence and systematic bias still need checking.</text></g>
