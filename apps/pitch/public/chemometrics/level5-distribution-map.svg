<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
 <title id="title">Relationships between five distribution families</title>
 <desc id="desc">Lognormal transforms to normal by taking a log ratio. Independent standard-normal squares sum to chi-square. An independent standard normal divided by a square root of chi-square scaled by degrees of freedom gives Student-t. The ratio of independent chi-squares each scaled by degrees of freedom gives F. Independence is required.</desc>
 <style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.arrow{fill:none;stroke:#126c82;stroke-width:4}.head{fill:#126c82}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.arrow{stroke:#7bd9e3}.head{fill:#7bd9e3}}</style>
 <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="head" d="M0 0l10 5-10 5z"/></marker></defs>
 <rect class="bg" width="1200" height="560" rx="18"/>
 <g class="box"><rect x="35" y="50" width="260" height="80" rx="12"/><rect x="470" y="50" width="260" height="80" rx="12"/><rect x="910" y="50" width="260" height="80" rx="12"/><rect x="250" y="373" width="260" height="80" rx="12"/><rect x="830" y="373" width="260" height="80" rx="12"/></g>
 <g class="ink" text-anchor="middle" font-size="36" font-weight="700"><text x="165" y="102">Lognormal</text><text x="600" y="102">Normal</text><text x="1040" y="102">Chi-square</text><text x="380" y="425">Student-t</text><text x="960" y="425">F</text></g>
 <g class="arrow" marker-end="url(#a)"><path d="M300 90H460"/><path d="M735 90H900"/><path d="M600 138V185H380V363"/><path d="M1040 138V295H485V363"/><path d="M1065 138V363"/></g>
 <g class="ink" text-anchor="middle" font-size="25"><text x="380" y="57">Log ratio</text><text x="820" y="43">Standardize,</text><text x="820" y="163">square and sum</text><text x="620" y="220">Standard normal numerator</text><text x="660" y="270">Independent chi-square:</text><text x="740" y="336">square root in denominator</text><text x="930" y="220">Ratio of two</text><text x="930" y="250">independent,</text><text x="930" y="280">scaled chi-squares</text></g>
 <g class="ink" text-anchor="middle" font-size="28"><text x="600" y="510">Scale each chi-square by its own degrees of freedom.</text><text x="600" y="546">Independence is essential; this map does not establish model fit.</text></g>
</svg>
