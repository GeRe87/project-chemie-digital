<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 390" font-family="system-ui, sans-serif">
<title>Where does the interaction sum of squares come from?</title>
<desc>In the SPE study, the additive model assigns 14 to method, 169 to matrix and 338 to residuals. Adding the interaction splits 338 into 278 for method by matrix and 60 for the remaining residual. Total sum of squares stays at 521.</desc>
<text x="35" y="42" font-size="29" font-weight="720" fill="var(--pcd-foreground)" text-anchor="start">Additive model · same 521 total</text>
<rect x="35" y="66" width="28" height="56" fill="#15546b" fill-opacity="1"/>
<text x="49.0" y="102" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"></text>
<rect x="63" y="66" width="334" height="56" fill="#4b3279" fill-opacity="1"/>
<text x="230.0" y="102" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">169</text>
<rect x="397" y="66" width="668" height="56" fill="#435668" fill-opacity="1"/>
<text x="731.0" y="102" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">338</text>
<text x="35" y="158" font-size="21" font-weight="650" fill="var(--pcd-foreground)" text-anchor="start">14 · Method (SS A)</text>
<text x="258" y="158" font-size="21" font-weight="650" fill="var(--pcd-foreground)" text-anchor="start">169 · Matrix (SS B)</text>
<text x="630" y="158" font-size="21" font-weight="650" fill="var(--pcd-foreground)" text-anchor="start">338 · Residual SS</text>
<g data-svg-stage="1"><text x="397" y="200" font-size="22" font-weight="650" fill="var(--pcd-foreground)" text-anchor="start">This is the variation left unexplained by method and matrix.</text></g>
<g data-svg-stage="2"><text x="35" y="255" font-size="29" font-weight="720" fill="var(--pcd-foreground)" text-anchor="start">Model with interaction · same 521 total</text>
<rect x="35" y="275" width="28" height="56" fill="#15546b" fill-opacity="1"/>
<text x="49.0" y="311" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle"></text>
<rect x="63" y="275" width="334" height="56" fill="#4b3279" fill-opacity="1"/>
<text x="230.0" y="311" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">169</text>
<rect x="397" y="275" width="550" height="56" fill="#a14518" fill-opacity="1"/>
<text x="672.0" y="311" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">278</text>
<rect x="947" y="275" width="118" height="56" fill="#435668" fill-opacity="1"/>
<text x="1006.0" y="311" font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">60</text>
<text x="397" y="365" font-size="22" font-weight="700" fill="var(--pcd-foreground)" text-anchor="start">278 · Method × matrix (SS AB)</text>
<text x="1065" y="365" font-size="21" font-weight="650" fill="var(--pcd-foreground)" text-anchor="end">60 · Residual SS</text></g>
</svg>
