<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 285" role="img" aria-labelledby="title desc">
<title id="title">Linear concentration gaps differ while reciprocal log-ratio gaps agree</title>
<desc id="desc">On the linear concentration axis, 8, 10 and 12.5 ng/L have gaps 2 and 2.5. On the natural-log-ratio axis relative to 10 ng/L they have coordinates minus 0.22314, zero and plus 0.22314 with equal spacing. Values are unchanged; only the coordinate system changes.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#17354b;font-size:24px}.line{stroke:#086a91;stroke-width:3;fill:none}.dot{fill:#086a91}.small{font-size:21px}@media(prefers-color-scheme:dark){text{fill:#e5f1fa}.line{stroke:#69ceef}.dot{fill:#69ceef}}</style>
<text x="35" y="35">Linear concentration</text><text x="475" y="35">Natural log ratio</text>
<path class="line" d="M35 115H415 M475 115H865"/>
<g class="dot"><circle cx="80" cy="115" r="7"/><circle cx="200" cy="115" r="7"/><circle cx="350" cy="115" r="7"/><circle cx="540" cy="115" r="7"/><circle cx="675" cy="115" r="7"/><circle cx="810" cy="115" r="7"/></g>
<text x="72" y="91">8</text><text x="187" y="91">10</text><text x="325" y="91">12.5</text><text x="532" y="91">8</text><text x="662" y="91">10</text><text x="785" y="91">12.5</text>
<text class="small" x="124" y="156">gap 2</text><text class="small" x="238" y="156">gap 2.5</text>
<text class="small" x="489" y="156">-0.22314</text><text class="small" x="669" y="156">0</text><text class="small" x="762" y="156">+0.22314</text>
<text class="small" x="56" y="211">Concentration in ng/L</text><text class="small" x="481" y="211">Log of concentration / 10 ng/L</text>
<text class="small" x="35" y="263">Equal reciprocal ratios become equal distances on a dimensionless logarithmic scale.</text>
</svg>
