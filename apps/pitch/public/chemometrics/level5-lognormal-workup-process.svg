<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 300" role="img" aria-labelledby="title desc">
<title id="title">Repeat injection or repeat the complete LC-MS/MS procedure</title>
<desc id="desc">Experiment A repeatedly injects the same prepared homogeneous control into the instrument. Experiment B takes independent aliquots from one homogeneous water sample through extraction, concentration and LC-MS/MS analysis. Reported concentrations use ng/L. Relative influences of preparation and response motivate a multiplicative model.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#17354b;font-size:22px}.line{stroke:#086a91;stroke-width:3;fill:none}.fill{fill:#1689ab;fill-opacity:.16}.small{font-size:19px}@media(prefers-color-scheme:dark){text{fill:#e5f1fa}.line{stroke:#69ceef}.fill{fill:#69ceef}}</style>
<text x="28" y="33">A: instrument-only repeats</text><text x="28" y="168">B: independent complete preparations</text>
<g class="line"><rect class="fill" x="30" y="54" width="210" height="62" rx="5"/><rect x="360" y="54" width="210" height="62" rx="5"/><rect x="690" y="54" width="170" height="62" rx="5"/>
<path d="M248 85h100m-12-7 12 7-12 7M578 85h100m-12-7 12 7-12 7"/>
<rect class="fill" x="30" y="190" width="160" height="62" rx="5"/><rect x="245" y="190" width="145" height="62" rx="5"/><rect x="445" y="190" width="160" height="62" rx="5"/><rect x="660" y="190" width="200" height="62" rx="5"/>
<path d="M195 221h43m-10-7 10 7-10 7M395 221h43m-10-7 10 7-10 7M610 221h43m-10-7 10 7-10 7"/></g>
<text x="48" y="91">Prepared control</text><text x="382" y="91">Repeat injection</text><text x="710" y="91">Result, ng/L</text>
<text x="47" y="227">Aliquot</text><text x="260" y="227">Extraction</text><text x="458" y="227">Concentrate</text><text x="677" y="227">LC-MS/MS</text>
<text class="small" x="30" y="285">The repeated procedure determines which sources of variation contribute to the result.</text>
</svg>
