<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="210" viewBox="0 0 1100 210" role="img" aria-labelledby="t d">
<title id="t">Twice the SD means four times the variance</title><desc id="d">Two labelled horizontal bars show sample SDs 0.20 and 0.10 mg/L with lengths in a two-to-one ratio. Two squares show variances 0.040 and 0.010 squared mg/L as areas in a four-to-one ratio. These are summary comparisons, not raw observations.</desc>
<rect x="2" y="2" width="1096" height="206" rx="14" fill="#f4f8fc" stroke="#56809c"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147"><text x="30" y="37" font-size="22" font-weight="bold">SD: COMPARE LENGTHS</text><text x="610" y="37" font-size="22" font-weight="bold">VARIANCE: COMPARE SQUARED SDs</text><text x="30" y="90" font-size="20">A · 0.20 mg/L</text><text x="30" y="151" font-size="20">B · 0.10 mg/L</text><text x="850" y="97" font-size="19">A · 0.040 (mg/L)²</text><text x="850" y="143" font-size="19">B · 0.010 (mg/L)²</text><text x="300" y="191" font-size="19" font-weight="bold">SD ratio: 2</text><text x="700" y="191" font-size="19" font-weight="bold">Variance ratio: 4</text></g>
<rect x="210" y="67" width="320" height="28" fill="#8754ae"/><rect x="210" y="128" width="160" height="28" fill="#277ba2"/><rect x="620" y="58" width="100" height="100" fill="#8754ae"/><rect x="755" y="108" width="50" height="50" fill="#277ba2"/>
</svg>
