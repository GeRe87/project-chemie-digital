<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 350" role="img" aria-labelledby="title desc">
<title id="title">z is a coordinate, phi is density, Phi is accumulated probability</title>
<desc id="desc">Schematic standard-normal density and CDF over z minus four to four. At z two, density is 0.053991 per z-unit, left probability 97.725 percent and upper probability 2.275 percent. The CDF ordinate equals the left density area. The drawing is schematic and truncated; probabilities are computed from the full law.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#17354b;font-size:19px}.axis{stroke:#38596a;stroke-width:2;fill:none}.curve{stroke:#086a91;stroke-width:3;fill:none}.left{fill:#1689ab;fill-opacity:.25}.tail{fill:#cc6a29;fill-opacity:.45}.mark{stroke:#a23c20;stroke-width:2;stroke-dasharray:5 4}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#e5f1fa}.axis{stroke:#b8cedd}.curve{stroke:#69ceef}.left{fill:#69ceef}.tail{fill:#ffba87}.mark{stroke:#ffba87}}</style>
<text x="45" y="27">Lowercase phi: density</text><text x="490" y="27">Uppercase Phi: left probability</text>
<text class="small" x="45" y="57">Density per z-unit</text><text class="small" x="490" y="57">Cumulative probability, unit 1</text>
