<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" role="img" aria-labelledby="title desc">
<title id="title">KS compares the largest vertical ECDF-to-CDF distance</title><desc id="desc">Same fixed normal model and same A/B samples as the Q-Q plots. Smooth teal curve is model CDF; dark stepped curve is ECDF. Orange vertical gaps mark maxima. A has maximum 0.144578 after the jump at 10.2; B has 0.725747 just before its first jump at 10.3. Open circles show left limits; filled points show included ECDF values.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.axis{fill:none;stroke:#294f60;stroke-width:2}.model{fill:none;stroke:#007c91;stroke-width:4}.emp{fill:none;stroke:#7b4893;stroke-width:3}.gap{stroke:#a25920;stroke-width:5}.open{fill:#f3f8fa;stroke:#7b4893;stroke-width:2}.closed{fill:#7b4893}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.axis{stroke:#c0dbe5}.model{stroke:#7bd9e3}.emp{stroke:#d7b2ef}.gap{stroke:#ffc083}.open{fill:#152f3a;stroke:#d7b2ef}.closed{fill:#d7b2ef}}</style>
