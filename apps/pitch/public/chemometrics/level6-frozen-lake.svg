<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="230" viewBox="0 0 1100 230" role="img" aria-labelledby="title desc">
<title id="title">Can I cross the frozen lake without breaking through?</title>
<desc id="desc">A person waits at a snowy shore. A cutaway reveals uneven ice above deep water and a weak spot. The question is whether thickness exceeds a hypothetical minimum. This illustration is not an ice safety assessment.</desc>
