<text x="770" y="54" font-size="23" font-weight="bold">Is the ice thick enough?</text><text x="770" y="91" font-size="19">A · Stay until evidence says go</text><text x="770" y="126" font-size="19">B · Go unless evidence says stay</text><text x="770" y="174" font-size="18" font-weight="bold" fill="#a23c28">Same question. Different risks.</text><text x="770" y="207" font-size="16">Model only. Not crossing advice.</text></g>
