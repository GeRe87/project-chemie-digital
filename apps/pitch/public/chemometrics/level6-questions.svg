<svg xmlns="http://www.w3.org/2000/svg" width="960" height="270" viewBox="0 0 960 270" role="img" aria-labelledby="title desc">
<title id="title">Three concrete measurement questions</title><desc id="desc">A quality-control sample with target 50 and measured mean 48.5 micrograms per litre; a river with sampling before and after an industrial park for diclofenac; and schematic algal growth trajectories for control and exposure. All are teaching scenarios, not field findings or legal limits.</desc>
<defs><style>text{font-family:Arial,Helvetica,sans-serif;fill:#153147;font-size:18px}.h{font-size:22px;font-weight:bold}</style></defs>
<rect x="10" y="10" width="300" height="250" rx="12" fill="#edf6fc" stroke="#176da0"/><rect x="330" y="10" width="300" height="250" rx="12" fill="#f2edfa" stroke="#6943a6"/><rect x="650" y="10" width="300" height="250" rx="12" fill="#eaf6ef" stroke="#247c5c"/>
<text class="h" x="30" y="43">QUALITY CONTROL</text><path d="M80 75H125V115L155 195Q158 210 145 210H60Q45 210 50 195L80 115Z" fill="#b8e4ef" stroke="#176da0" stroke-width="3"/><path d="M65 170H142" stroke="#176da0" stroke-width="3"/><text x="173" y="112">Target</text><text x="173" y="139">50 µg/L</text><text x="173" y="183">Mean</text><text x="173" y="210">48.5 µg/L</text>
<text class="h" x="350" y="43">RIVER WATER</text><path d="M353 204Q398 165 443 197T610 191" fill="none" stroke="#359bc1" stroke-width="24"/><path d="M447 137V105L474 120V105L503 120V92H532V137Z" fill="#6943a6"/><path d="M519 92V68" stroke="#6943a6" stroke-width="10"/><circle cx="389" cy="183" r="10" fill="#176da0"/><circle cx="580" cy="199" r="10" fill="#a85b13"/><text x="350" y="158">Before</text><text x="563" y="158">After</text><text x="360" y="240">Industrial park · diclofenac</text>
<text class="h" x="670" y="43">ALGAL GROWTH</text><path d="M695 80V211H916" fill="none" stroke="#153147" stroke-width="2"/><path d="M699 200L740 185L780 157L820 120L870 78" fill="none" stroke="#247c5c" stroke-width="4"/><path d="M699 200L740 192L780 178L820 159L870 136" fill="none" stroke="#843a87" stroke-width="4" stroke-dasharray="8 5"/><text x="735" y="237">Time (days)</text><text transform="translate(679 204) rotate(-90)">Biomass</text><text x="782" y="76">Control</text><text x="817" y="171">Exposure</text>
