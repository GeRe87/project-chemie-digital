<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="t d"><title id="t">Two methods: independent precision studies</title><desc id="d">Each method measures six independent preparations of a homogeneous reference material. SD A is 0.20 and SD B 0.10 mg/L. SD bars have lengths two to one; variance squares have areas four to one. Exact F calibration requires independent Normal errors.</desc><rect x="2" y="2" width="656" height="436" rx="14" fill="#f4f8fc" stroke="#56809c"/><g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="22"><text x="330" y="40" text-anchor="middle" font-weight="bold">6 PREPARATIONS PER METHOD</text><text x="35" y="103">A: SD 0.20 mg/L</text><text x="35" y="170">B: SD 0.10 mg/L</text><text x="35" y="235">Square the SDs before dividing</text><text x="330" y="394" text-anchor="middle">SD ratio 2 · variance ratio 4</text></g><rect x="290" y="80" width="300" height="28" fill="#8754ae"/><rect x="290" y="147" width="150" height="28" fill="#277ba2"/><rect x="290" y="260" width="100" height="100" fill="#8754ae"/><rect x="470" y="310" width="50" height="50" fill="#277ba2"/></svg>
