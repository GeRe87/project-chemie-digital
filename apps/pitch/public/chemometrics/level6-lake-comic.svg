<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="490" viewBox="0 0 1100 490" role="img" aria-labelledby="t d"><title id="t">Conservative and progressive decisions at the same lake</title><desc id="d">Two comic panels show true thickness 10.3 cm above a 10 cm boundary, then 9.7 cm below. A cautious figure requires evidence before going: GO rates32.8% and0.22%. A progressive figure goes unless thin ice is detected:99.8% and67.2%. Fixed known-SD Normal model: four independent readings, SD0.5 cm, alpha5%. Probabilities describe decisions, not physical collapse.</desc>
<rect x="2" y="2" width="1096" height="486" rx="14" fill="#f4f8fc" stroke="#56809c"/>
<g fill="#e0edf6" stroke="#56809c"><rect x="14" y="18" width="528" height="405" rx="12"/><rect x="558" y="18" width="528" height="405" rx="12"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle"><text x="278" y="55" font-size="27" font-weight="bold">THICK ENOUGH: 10.3 &gt; 10 cm</text><text x="822" y="55" font-size="27" font-weight="bold">TOO THIN: 9.7 &lt; 10 cm</text></g>
<g fill="#fff" stroke="#56809c" stroke-width="2"><path d="M36 82H264V232H172L158 251V232H36Z"/><path d="M282 82H520V232H426L412 251V232H282Z"/><path d="M580 82H808V232H716L702 251V232H580Z"/><path d="M826 82H1064V232H970L956 251V232H826Z"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle" font-size="23"><text x="150" y="118">“Evidence first.”</text><text x="150" y="166" font-size="31" font-weight="bold">GO: 32.8%</text><text x="150" y="205">Often stay</text><text x="401" y="118">“GO by default.”</text><text x="401" y="166" font-size="31" font-weight="bold">GO: 99.8%</text><text x="401" y="205">Usually go</text><text x="694" y="118">“Evidence first.”</text><text x="694" y="166" font-size="31" font-weight="bold">GO: 0.22%</text><text x="694" y="205">Rare false GO</text><text x="945" y="118">“GO by default.”</text><text x="945" y="166" font-size="31" font-weight="bold">GO: 67.2%</text><text x="945" y="205">Frequent false GO</text></g>
