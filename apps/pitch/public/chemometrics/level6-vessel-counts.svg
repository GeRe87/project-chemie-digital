<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="t d"><title id="t">Vessel classifications and the independence prediction</title><desc id="d">Control has 8 affected and 12 unaffected vessels, exposure 14 and 6. Of 40 independent vessels,22 are affected. Independence predicts 11 affected and 9 unaffected in each group of twenty.</desc><rect x="2" y="2" width="656" height="436" rx="14" fill="#f4f8fc" stroke="#56809c"/><rect x="22" y="60" width="616" height="200" rx="8" fill="#e0edf6" stroke="#56809c"/><path d="M22 125H638M22 192H638M240 60V260M430 60V260" stroke="#56809c"/><g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="23"><text x="330" y="38" text-anchor="middle" font-weight="bold">ONE VESSEL, ONE CELL</text><text x="255" y="102">Affected</text><text x="445" y="102">Unaffected</text><text x="40" y="167">Control</text><text x="40" y="235">Exposure</text><text x="330" y="167">8</text><text x="520" y="167">12</text><text x="330" y="235">14</text><text x="520" y="235">6</text><text x="330" y="315" text-anchor="middle">Overall: 22 of 40 affected</text><text x="330" y="358" text-anchor="middle">If group and damage are independent:</text><text x="330" y="400" text-anchor="middle" font-weight="bold">11 affected · 9 unaffected per group</text></g></svg>
