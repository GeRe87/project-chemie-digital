<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc" style="background:#eef9fc">
  <title id="title">Five dice, one sum</title>
  <desc id="desc">Five dice contribute to one sum. Repeat the experiment to collect a sample of sums.</desc>
  <g fill="#eef9fc" stroke="#193e54" stroke-width="4">
    <rect x="60" y="55" width="120" height="120" rx="16"/>
    <rect x="250" y="55" width="120" height="120" rx="16"/>
    <rect x="440" y="55" width="120" height="120" rx="16"/>
    <rect x="630" y="55" width="120" height="120" rx="16"/>
    <rect x="820" y="55" width="120" height="120" rx="16"/>
  </g>
  <g fill="#193e54">
    <circle cx="120" cy="115" r="10"/>
    <circle cx="280" cy="85" r="10"/><circle cx="340" cy="145" r="10"/>
    <circle cx="470" cy="85" r="10"/><circle cx="500" cy="115" r="10"/><circle cx="530" cy="145" r="10"/>
    <circle cx="660" cy="85" r="10"/><circle cx="720" cy="85" r="10"/><circle cx="660" cy="145" r="10"/><circle cx="720" cy="145" r="10"/>
    <circle cx="850" cy="85" r="10"/><circle cx="910" cy="85" r="10"/><circle cx="880" cy="115" r="10"/><circle cx="850" cy="145" r="10"/><circle cx="910" cy="145" r="10"/>
  </g>
  <g fill="#193e54" font-family="Arial, sans-serif" font-size="40" text-anchor="middle">
    <text x="215" y="130">+</text><text x="405" y="130">+</text><text x="595" y="130">+</text><text x="785" y="130">+</text>
    <text x="500" y="245">Five outcomes → one sum</text>
  </g>
</svg>
