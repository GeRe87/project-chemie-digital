  </g>
  <g fill="currentColor" font-family="Arial, sans-serif" font-size="29" text-anchor="middle">
    <text x="125" y="215">4.8 mg/L</text><text x="350" y="215">5.0 mg/L</text><text x="575" y="215">5.2 mg/L</text>
  </g>
</svg>
