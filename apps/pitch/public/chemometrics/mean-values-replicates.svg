  <title id="title">Nitrate measurement replicates</title>
  <desc id="desc">Three comparable nitrate replicates, 4.8, 5.0 and 5.2 milligrams per litre, represented by identical laboratory flasks.</desc>
  <g fill="none" stroke="currentColor" stroke-width="4">
