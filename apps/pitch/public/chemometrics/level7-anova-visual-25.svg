<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 375" role="img" aria-labelledby="title desc">
<title id="title">One family of three comparisons</title><desc id="desc">One shared rule controls the risk of at least one false rejection among the three pairwise comparisons.</desc>
<rect x="0" y="0" width="930" height="375" rx="14" fill="#f3f8fb"/><g font-family="system-ui, sans-serif">
<text x="465" y="44" text-anchor="middle" font-size="25" font-weight="700" fill="#163349">All three comparisons belong to one family</text>
<rect x="69" y="80" width="792" height="176" rx="14" fill="#dceef5"/>
<rect x="133" y="133" width="156" height="59" rx="14" fill="#ebe3f5"/>
<text x="211" y="171" text-anchor="middle" font-size="21" font-weight="700" fill="#163349">A vs B</text>
<rect x="387" y="133" width="156" height="59" rx="14" fill="#fae8dd"/>
<text x="465" y="171" text-anchor="middle" font-size="21" font-weight="700" fill="#163349">A vs C</text>
<rect x="641" y="133" width="156" height="59" rx="14" fill="#dceef5"/>
<text x="719" y="171" text-anchor="middle" font-size="21" font-weight="700" fill="#163349">B vs C</text>
<text x="465" y="232" text-anchor="middle" font-size="19" font-weight="700" fill="#163349">One rule for the set</text>
<text x="465" y="309" text-anchor="middle" font-size="22" font-weight="500" fill="#163349">Family-wise error: at least one false rejection</text>
<text x="465" y="341" text-anchor="middle" font-size="18" font-weight="500" fill="#163349">Target here: α = 0.05</text>
</g></svg>
