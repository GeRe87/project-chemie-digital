<path d="M120 229.5L140 229.2L160 228.9L180 228.3L200 227.5L220 226.2L240 224.2L260 221.2L280 216.7L300 210L320 200.4L340 186.9L360 169L380 146.3L400 120L420 92.4L440 67.6L460 50.1L480 43.7L500 50.1L520 67.6L540 92.4L560 120L580 146.3L600 169L620 186.9L640 200.4L660 210L680 216.7L700 221.2L720 224.2L740 226.2L760 227.5L780 228.3L800 228.9L820 229.2L840 229.5" fill="none" stroke="#176da0" stroke-width="4"/>
