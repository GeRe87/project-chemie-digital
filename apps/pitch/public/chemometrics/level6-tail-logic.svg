<title id="title">The p-value counts results at least as extreme as ours, assuming the null model</title><desc id="desc">An upper-tail example uses a Student t reference with nine degrees of freedom. The observed statistic is 2. The orange area starts at that statistic and follows the very same sampled curve to the right plot boundary. The calculated p-value also includes the unshown remainder of the tail.</desc>
