<g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="20"><text x="55" y="45">Assume H₀: the mean is at the limit</text><text x="55" y="76">How would the test statistic vary?</text><text x="654" y="148" font-weight="bold">Our result or higher</text><text x="654" y="176">This tail gives the p-value</text><text x="613" y="260">Our result</text><text x="300" y="292">Test statistic: smaller ← → larger</text></g>
