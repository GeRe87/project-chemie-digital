<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520" role="img" aria-labelledby="t d"><title id="t">A flat response model versus a concentration-dependent calibration</title><desc id="d">Two schematic panels share axes: concentration horizontally and response vertically. The reduced model has a constant response, the full model adds a slope. Both models use the same standards. The second panel has smaller residual distances to its line. Dots are illustrative model geometry, not numerical observations used in the worked test.</desc><rect x="2" y="2" width="996" height="516" rx="14" fill="#f4f8fc" stroke="#56809c"/><g stroke="#20485e" stroke-width="3" fill="none"><path d="M70 395V100M70 395H450M570 395V100M570 395H950"/><path d="M90 260H430" stroke="#277ba2" stroke-width="5"/><path d="M590 360L930 140" stroke="#7545a0" stroke-width="5"/></g><g fill="#153147" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="24"><text x="260" y="55" font-weight="bold">H₀: CONSTANT RESPONSE</text><text x="760" y="55" font-weight="bold">H₁: NONZERO SLOPE</text><text x="260" y="450">Concentration</text><text x="760" y="450">Concentration</text><text x="500" y="494" font-size="20">Same standards · one added coefficient · independent Normal errors</text></g><g fill="#277ba2"><circle cx="120" cy="350" r="9"/><circle cx="200" cy="310" r="9"/><circle cx="280" cy="220" r="9"/><circle cx="380" cy="165" r="9"/></g><g fill="#7545a0"><circle cx="620" cy="350" r="9"/><circle cx="700" cy="310" r="9"/><circle cx="780" cy="220" r="9"/><circle cx="880" cy="165" r="9"/></g><g stroke="#a65b28" stroke-width="2" stroke-dasharray="5 3"><path d="M120 350V260M200 310V260M280 220V260M380 165V260M620 350V341M700 310V289M780 220V237M880 165V172"/></g></svg>
