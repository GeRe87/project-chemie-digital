<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="2" data-teaching-stage-mode="cumulative">
<title>normal equation sums</title><desc>Column products for the drift design: five ones sum to 5; times sum to 10; squared times sum to 30. Stage 1 assembles X transpose X as [[5,10],[10,30]]. Stage 2 adds X transpose y = [25,69.9].</desc>
<g><text x="80" y="100" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">count: 5</text><text x="80" y="180" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">sum of times: 10 min</text><text x="80" y="260" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">sum of squared times: 30 min²</text></g><g data-svg-stage="1"><path d="M 528 125 h -10 v 128 h 10 M 656 125 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="540" y="160" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">5</text><text x="604" y="160" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">10</text><text x="540" y="224" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">10</text><text x="604" y="224" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">30</text></g><g data-svg-stage="2"><path d="M 808 125 h -10 v 170 h 10 M 893 125 h 10 v 170 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="820" y="160" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">25</text><text x="820" y="245" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">69.9</text></g></svg>