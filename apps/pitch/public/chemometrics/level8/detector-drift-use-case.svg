<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" data-teaching-stage-count="2" data-teaching-stage-mode="cumulative">
  <title>From detector readings to a missing time point</title>
  <desc>A detector and clock introduce the measurement. The next frame shows five readings and marks 2.5 minutes. The last frame adds a candidate straight line through the observed range and extends it beyond the last reading.</desc>
  <g font-family="system-ui, sans-serif">
    <path d="M78 383H490" stroke="#697883" stroke-width="2"/>
    <rect x="104" y="119" width="326" height="223" rx="27" fill="#dceef5" stroke="#527283" stroke-width="3"/>
    <path d="M129 342v23h54v-23m166 0v23h54v-23" fill="none" stroke="#527283" stroke-width="4" stroke-linejoin="round"/>
    <rect x="136" y="158" width="262" height="112" rx="12" fill="#152330" stroke="#527283" stroke-width="2"/>
    <path d="M156 223h43l14-24 24 41 24-58 26 41h90" fill="none" stroke="#64cce8" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="161" cy="304" r="7" fill="#10698a"/>
    <path d="M196 304h69m20 0h26" stroke="#527283" stroke-width="4" stroke-linecap="round"/>
    <circle cx="432" cy="144" r="50" fill="#f7fafc" stroke="#527283" stroke-width="3"/>
    <path d="M432 119v25l17 9" fill="none" stroke="#10698a" stroke-width="4" stroke-linecap="round"/>
    <text x="267" y="433" text-anchor="middle" fill="currentColor" font-size="31" font-weight="700">Detector</text>
    <text x="267" y="470" text-anchor="middle" fill="currentColor" font-size="23">One reading per minute</text>
    <text x="592" y="86" fill="currentColor" font-size="32" font-weight="700">Follow the signal over time</text>
    <text x="592" y="126" fill="currentColor" font-size="24">Record five readings during one run.</text>
  </g>
  <g data-svg-stage="1" font-family="system-ui, sans-serif">
    <path d="M622 192H1103M622 302H1103" fill="none" stroke="#697883" stroke-width="1" opacity=".42"/>
    <path d="M622 192V412H1103" fill="none" stroke="currentColor" stroke-width="2"/>
    <g fill="currentColor" font-size="20">
      <text x="622" y="176">Signal (mV)</text>
      <text x="609" y="199" text-anchor="end">12</text>
      <text x="609" y="309" text-anchor="end">6</text>
      <text x="609" y="419" text-anchor="end">0</text>
      <text x="649" y="448" text-anchor="middle">0</text>
      <text x="735" y="448" text-anchor="middle">1</text>
      <text x="821" y="448" text-anchor="middle">2</text>
      <text x="907" y="448" text-anchor="middle">3</text>
      <text x="993" y="448" text-anchor="middle">4</text>
      <text x="861" y="489" text-anchor="middle">Time (min)</text>
    </g>
    <g fill="#10698a">
      <circle cx="649" cy="391.83" r="8"/>
      <circle cx="735" cy="360.67" r="8"/>
      <circle cx="821" cy="316.67" r="8"/>
      <circle cx="907" cy="285.5" r="8"/>
      <circle cx="993" cy="247" r="8"/>
    </g>
    <path d="M864 412v-13m0-9v-13m0-9v-13m0-9v-13m0-9v-13m0-9v-13m0-9v-13m0-9v-13m0-9v-13m0-9v-13" fill="none" stroke="#a14518" stroke-width="2"/>
    <text x="864" y="448" text-anchor="middle" fill="#a14518" font-size="20" font-weight="700">2.5</text>
  </g>
  <g data-svg-stage="2" font-family="system-ui, sans-serif">
    <text x="100" y="42" fill="#5c3a98" font-size="29" font-weight="700">Model signal as a function of time</text>
    <text x="100" y="76" fill="currentColor" font-size="23">Start with a straight line. Which one fits?</text>
    <path d="M649 386.3L993 254.3M993 254.3l14-5.4m9-3.4 14-5.4m9-3.4 14-5.4m9-3.4 17-6.6" fill="none" stroke="#5c3a98" stroke-width="4" stroke-linecap="round"/>
    <circle cx="864" cy="303.83" r="7" fill="#a14518"/>
    <text x="854" y="281" text-anchor="end" fill="#a14518" font-size="20" font-weight="700">Interpolate</text>
    <text x="1091" y="202" text-anchor="end" fill="#5c3a98" font-size="20" font-weight="700">Extrapolate</text>
    <text x="1079" y="448" text-anchor="middle" fill="currentColor" font-size="20">5</text>
  </g>
</svg>
