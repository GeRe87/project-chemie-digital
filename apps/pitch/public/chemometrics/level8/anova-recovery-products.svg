</g>
<g data-svg-stage="2">
<path d="M455 253 H1165" fill="none" stroke="currentColor" stroke-width="1.4" opacity="0.35"/>
<text x="455" y="290" text-anchor="start" font-size="27" fill="#a46ac4" font-weight="700">Xᵀy  ·  Sum the selected recoveries</text>
<text x="455" y="334" text-anchor="start" font-size="20" fill="#a46ac4" font-weight="700">1 × y</text>
<text x="568" y="334" text-anchor="start" font-size="20" fill="currentColor" font-weight="500">564 + 588 + 558 = 1710</text>
<text x="455" y="383" text-anchor="start" font-size="20" fill="#a46ac4" font-weight="700">B × y</text>
<text x="568" y="383" text-anchor="start" font-size="20" fill="currentColor" font-weight="500">Sum of all six B recoveries = 588</text>
<text x="455" y="432" text-anchor="start" font-size="20" fill="#a46ac4" font-weight="700">C × y</text>
<text x="568" y="432" text-anchor="start" font-size="20" fill="currentColor" font-weight="500">Sum of all six C recoveries = 558</text>
<path d="M1054 302 H1045 V459 H1054 M1155 302 H1164 V459 H1155" fill="none" stroke="#a46ac4" stroke-width="2.5" opacity="1"/>
<text x="1105" y="338" text-anchor="middle" font-size="26" fill="#a46ac4" font-weight="700">1710</text>
<text x="1105" y="385" text-anchor="middle" font-size="26" fill="#a46ac4" font-weight="700">588</text>
<text x="1105" y="432" text-anchor="middle" font-size="26" fill="#a46ac4" font-weight="700">558</text>
</g>
</g>
</svg>
