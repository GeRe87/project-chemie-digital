<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="2" data-teaching-stage-mode="cumulative">
<title>matrix order</title><desc>The product AB is [[19,22],[43,50]]. Stage 1 adds BA = [[23,34],[31,46]]. Stage 2 adds entrywise product [[5,12],[21,32]], which is different again.</desc>
<g><text x="100" y="100" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">AB</text><path d="M 88 155 h -10 v 128 h 10 M 216 155 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="100" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">19</text><text x="164" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">22</text><text x="100" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">43</text><text x="164" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">50</text></g><g data-svg-stage="1"><text x="420" y="100" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">BA</text><path d="M 408 155 h -10 v 128 h 10 M 536 155 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="420" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">23</text><text x="484" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">34</text><text x="420" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">31</text><text x="484" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">46</text></g><g data-svg-stage="2"><text x="720" y="100" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">entrywise</text><path d="M 728 155 h -10 v 128 h 10 M 856 155 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="740" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">5</text><text x="804" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">12</text><text x="740" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">21</text><text x="804" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">32</text></g></svg>