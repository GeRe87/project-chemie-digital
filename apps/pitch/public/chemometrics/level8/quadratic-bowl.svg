<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="1" data-teaching-stage-mode="cumulative">
<title>quadratic bowl</title><desc>A dimensionless squared-distance bowl has its lowest point at trial value 3. Stage 1 adds a horizontal tangent at the minimum; the vertical axis is squared distance, not a probability.</desc>
<g><path d="M100 420 H900 M100 420 V50" stroke="currentColor" fill="none" stroke-width="2" /><path d="M180 100 Q500 730 820 100" stroke="var(--pcd-accent)" fill="none" stroke-width="4" /><text x="470" y="465" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">3</text><text x="700" y="490" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">trial value</text><text x="110" y="35" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">squared distance</text></g><g data-svg-stage="1"><path d="M380 415 H620" stroke="var(--pcd-chart-series-2)" fill="none" stroke-width="4" /><text x="650" y="380" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">zero slope</text></g></svg>