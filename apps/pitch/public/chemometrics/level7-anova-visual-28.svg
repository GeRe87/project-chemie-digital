<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 375" role="img" aria-labelledby="title desc">
<title id="title">Which follow-up fits the comparison?</title><desc id="desc">Tukey for all pairs with common variance; Holm or Bonferroni for a defined family of valid tests; Games–Howell for pairs with unequal variances.</desc>
<rect x="0" y="0" width="930" height="375" rx="14" fill="#f3f8fb"/><g font-family="system-ui, sans-serif">
<text x="465" y="45" text-anchor="middle" font-size="23" font-weight="700" fill="#163349">Match the follow-up to the question and variance</text>
<rect x="27" y="80" width="276" height="186" rx="14" fill="#dceef5"/>
<text x="165" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#163349">All pairs</text>
<text x="165" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#163349">Tukey HSD</text>
<text x="165" y="222" text-anchor="middle" font-size="17" font-weight="500" fill="#163349">Common variance</text>
<rect x="327" y="80" width="276" height="186" rx="14" fill="#ebe3f5"/>
<text x="465" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#163349">Defined family</text>
<text x="465" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#163349">Holm / Bonferroni</text>
<text x="465" y="222" text-anchor="middle" font-size="17" font-weight="500" fill="#163349">Valid individual tests</text>
<rect x="627" y="80" width="276" height="186" rx="14" fill="#fae8dd"/>
<text x="765" y="119" text-anchor="middle" font-size="20" font-weight="700" fill="#163349">All pairs</text>
<text x="765" y="174" text-anchor="middle" font-size="22" font-weight="700" fill="#163349">Games–Howell</text>
<text x="765" y="222" text-anchor="middle" font-size="17" font-weight="500" fill="#163349">Unequal variances</text>
<text x="465" y="329" text-anchor="middle" font-size="20" font-weight="500" fill="#163349">Plan the comparison family before interpreting results.</text>
</g></svg>
