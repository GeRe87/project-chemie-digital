<svg xmlns="http://www.w3.org/2000/svg" width="960" height="470" viewBox="0 0 960 470" role="img" aria-labelledby="title desc">
<title id="title">Prospective power increases with effect and independent replication</title>
<desc id="desc">Exact power of a two-sided one-sample z-test with known population SD, independent Normal observations and alpha 0.05. Horizontal: true mean departure divided by population SD, zero to 1.5. Vertical: rejection probability zero to one. Curves show independent sample sizes 5,10,20. At zero effect rejection probability is 0.05. This is a known-SD planning model, not t-test power.</desc>
<rect x="10" y="10" width="940" height="450" rx="14" fill="#f5f8fc" stroke="#176da0" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147"><text x="65" y="48" font-size="25" font-weight="bold">More independent units detect smaller effects</text><text x="65" y="77" font-size="18">Known-SD Normal model · two-sided z-test · alpha 0.05</text></g>
