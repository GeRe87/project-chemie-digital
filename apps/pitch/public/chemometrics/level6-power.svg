<path d="M110 328L158 325.2L206 316.7L254 302.1L302 281.4L350 255.4L398 226L446 196L494 168.3L542 145.1L590 127.5L638 115.5L686 108L734 103.8L782 101.6L830 100.6" fill="none" stroke="#843a87" stroke-width="4" stroke-dasharray="10 5"/>
