<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 460" font-family="system-ui, sans-serif">
<title>When one factor changes the effect of another</title>
<desc>Plant growth in centimetres is compared with and without added nutrients. Blue denotes adequate water and purple limited water. Widening or narrowing gaps illustrate synergy or antagonism for this specified nutrient response under different water supplies. Illustrative confidence intervals show uncertainty. The interaction test assesses whether the gaps change beyond sampling variation.</desc>
