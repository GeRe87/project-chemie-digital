<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Two independent variance estimates lead to F</title><desc id="desc">Six independent normal control results per method. Fit one mean per series and divide the squared-deviation sum by five. Prespecify method B variance over A variance. Under equal true variances and independent series, the ratio follows F with ordered five and five degrees of freedom.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}}</style>
<rect class="bg" width="1200" height="470" rx="18"/><g class="box"><rect x="30" y="40" width="380" height="150" rx="14"/><rect x="30" y="235" width="380" height="150" rx="14"/><rect x="490" y="110" width="300" height="200" rx="14"/><rect x="870" y="110" width="300" height="200" rx="14"/></g>
<g class="ink" text-anchor="middle" font-size="27"><text x="220" y="85">Method A: six normal results</text><text x="220" y="130">Fit mean, estimate variance</text><text x="220" y="170">5 residual df</text><text x="220" y="280">Method B: six normal results</text><text x="220" y="325">Fit mean, estimate variance</text><text x="220" y="365">5 residual df</text><text x="640" y="160">Prespecified ratio</text><text x="640" y="215">B variance / A variance</text><text x="640" y="270">Two uncertain estimates</text><text x="1020" y="160">Equal true variances</text><text x="1020" y="215">→ F reference (5,5)</text><text x="1020" y="270">Compare with cutoff</text><text x="600" y="445">Independent series and normality are required. This compares precision, not accuracy.</text></g>
<path class="line" d="M410 115H450V180H480M410 310H450V245H480M795 210H860"/>
</svg>
