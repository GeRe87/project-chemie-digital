<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="t d"><title id="t">Independent preparations measured by NIR and HPLC-MS</title><desc id="d">A near-infrared sensor and a liquid chromatograph with mass spectrometer measure pollutant concentration in separate independent preparations of one homogeneous reference material. These are not the same environmental samples measured twice. Calibration and measurement variability may differ.</desc><rect x="2" y="2" width="656" height="436" rx="14" fill="#f4f8fc" stroke="#56809c"/><rect x="55" y="130" width="220" height="140" rx="14" fill="#d9eee4" stroke="#287452" stroke-width="3"/><rect x="355" y="100" width="250" height="195" rx="12" fill="#e5dcf4" stroke="#7545a0" stroke-width="3"/><path d="M80 195Q115 145 145 195T225 195" fill="none" stroke="#287452" stroke-width="4"/><path d="M385 232H575M400 232L420 230L440 154L450 232L480 232L495 190L510 232" fill="none" stroke="#7545a0" stroke-width="4"/><g fill="#153147" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="22"><text x="330" y="40" font-weight="bold">ONE POLLUTANT, TWO SYSTEMS</text><text x="165" y="110">NIR sensor</text><text x="480" y="80">HPLC-MS</text><text x="165" y="310">5 preparations</text><text x="480" y="335">6 preparations</text><text x="330" y="377">Independent sets, concentration in µg/L</text><text x="330" y="410" font-size="17">Shared samples would require a paired method comparison</text></g></svg>
