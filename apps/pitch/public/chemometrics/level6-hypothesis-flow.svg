<svg xmlns="http://www.w3.org/2000/svg" width="960" height="210" viewBox="0 0 960 210" role="img" aria-labelledby="title desc">
<title id="title">Reason from a hypothesis to a testable prediction</title><desc id="desc">Four linked steps: assume H0, predict how the test statistic varies, locate the observed result, and decide whether to reject H0. A decision is not proof that either hypothesis is true.</desc>
<rect x="10" y="10" width="940" height="190" rx="12" fill="#f5f8fc" stroke="#176da0"/>
<g fill="#e4f2fc" stroke="#176da0" stroke-width="2"><rect x="30" y="35" width="195" height="125" rx="10"/><rect x="265" y="35" width="195" height="125" rx="10"/><rect x="500" y="35" width="195" height="125" rx="10"/><rect x="735" y="35" width="195" height="125" rx="10"/></g>
<path d="M231 97H258M466 97H493M701 97H728" stroke="#6943a6" stroke-width="5"/><path d="M250 89L258 97L250 105M485 89L493 97L485 105M720 89L728 97L720 105" fill="none" stroke="#6943a6" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="20" text-anchor="middle"><text x="128" y="80" font-weight="bold">H₀</text><text x="128" y="118">Starting point</text><text x="363" y="80" font-weight="bold">PREDICT</text><text x="363" y="112">Reference</text><text x="363" y="138">distribution</text><text x="598" y="80" font-weight="bold">COMPARE</text><text x="598" y="118" font-weight="bold">Test statistic</text><text x="833" y="80" font-weight="bold">DECIDE</text><text x="833" y="112">Reject H₀ or</text><text x="833" y="138">do not reject H₀</text></g>
</svg>
