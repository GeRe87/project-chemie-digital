<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" role="img" aria-labelledby="title description">
  <title id="title">Equal volumes, varying detected particle counts</title>
  <desc id="description">Constructed illustrations of three filters representing 100 mL each, with 2, 4 and 6 particles. Not measured or simulated data.</desc>
  <rect width="960" height="420" rx="16" fill="#f3fafb"/>
  <g fill="#e1eff1" stroke="#126577" stroke-width="4"><circle cx="160" cy="175" r="108"/><circle cx="480" cy="175" r="108"/><circle cx="800" cy="175" r="108"/></g>
  <g fill="#713bb0"><circle cx="128" cy="152" r="10"/><circle cx="195" cy="207" r="10"/>
    <circle cx="430" cy="140" r="10"/><circle cx="488" cy="210" r="10"/><circle cx="538" cy="163" r="10"/><circle cx="471" cy="113" r="10"/>
    <circle cx="748" cy="118" r="10"/><circle cx="815" cy="157" r="10"/><circle cx="852" cy="216" r="10"/><circle cx="769" cy="222" r="10"/><circle cx="803" cy="105" r="10"/><circle cx="735" cy="179" r="10"/>
  </g>
  <g fill="#143e4a" font-family="Arial, sans-serif" text-anchor="middle"><text x="160" y="43" font-size="29">100 mL</text><text x="480" y="43" font-size="29">100 mL</text><text x="800" y="43" font-size="29">100 mL</text><text x="160" y="330" font-size="32">2 particles</text><text x="480" y="330" font-size="32">4 particles</text><text x="800" y="330" font-size="32">6 particles</text><text x="480" y="390" font-size="23">Constructed illustrations, not measurements or simulated data</text></g>
</svg>
