<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" role="img" aria-labelledby="title desc">
<title id="title">Sample means, known scale and estimated scale</title><desc id="desc">Repeated independent normal series give a normal sample mean. Centering and dividing by known population standard error gives standard normal. Dividing instead by the same series' estimated standard error gives Student-t. Five observations leave four degrees of freedom; growing sample size stabilizes the denominator.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}.dot{fill:#126c82}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}.dot{fill:#7bd9e3}}</style>
<rect class="bg" width="1200" height="490" rx="18"/><g class="box"><rect x="30" y="90" width="320" height="270" rx="14"/><rect x="445" y="40" width="715" height="155" rx="14"/><rect x="445" y="235" width="715" height="155" rx="14"/></g>
<g class="ink" text-anchor="middle" font-size="28"><text x="190" y="140">Repeat five-result series</text><text x="190" y="280">Each series gives</text><text x="190" y="320">a mean and an SD</text><text x="802" y="85">Center mean / known standard error</text><text x="802" y="135">→ Standard normal</text><text x="802" y="175">Mean itself is normal under normal sampling</text><text x="802" y="280">Center mean / estimated standard error</text><text x="802" y="330">→ Student-t with 4 df</text><text x="802" y="370">Same data also estimate the denominator</text><text x="600" y="445">More degrees of freedom stabilize estimated SD: t approaches normal.</text><text x="600" y="480">We need a reference for uncertainty in the analytical mean.</text></g>
<path class="line" d="M350 225H390V115H435M390 225V310H435M90 230H290"/><g class="dot"><circle cx="110" cy="215" r="7"/><circle cx="145" cy="203" r="7"/><circle cx="180" cy="210" r="7"/><circle cx="215" cy="196" r="7"/><circle cx="250" cy="218" r="7"/></g>
</svg>
