<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 510" font-family="system-ui, sans-serif">
<title>Water treatment: compare techniques across conditions</title>
<desc>Use the additive model to compare marginal means averaged equally over the three conditions. AC is activated carbon, UF ultrafiltration and IX ion exchange. Use the additive model MSE and 31 error degrees of freedom. Average over the three water conditions: HSD 2.30 percentage points. AC versus UF, adjusted p 4.305e-11. AC versus IX, adjusted p 5.329e-15. UF versus IX, adjusted p 8.704e-09.</desc>
<text x="245" y="34" font-size="26" font-weight="700" fill="#10698a" text-anchor="start">Average over the three water conditions</text>
<text x="245" y="66" font-size="20" font-weight="700" fill="#5c3a98" text-anchor="start">HSD = 2.30 pp</text>
<text x="245" y="103" font-size="19" font-weight="700" fill="#163349" text-anchor="start">Matrix of adjusted p-values</text>
<text x="463" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">AC</text>
<text x="589" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">UF</text>
<text x="715" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">IX</text>
<text x="245" y="162" font-size="19" font-weight="700" fill="#163349" text-anchor="start">AC</text>
<text x="463" y="162" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="589" y="162" font-size="20" font-weight="700" fill="#a14518" text-anchor="middle">&lt;0.001</text>
<text x="715" y="162" font-size="20" font-weight="700" fill="#a14518" text-anchor="middle">&lt;0.001</text>
<text x="245" y="192" font-size="19" font-weight="700" fill="#163349" text-anchor="start">UF</text>
<text x="589" y="192" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="715" y="192" font-size="20" font-weight="700" fill="#a14518" text-anchor="middle">&lt;0.001</text>
<text x="245" y="222" font-size="19" font-weight="700" fill="#163349" text-anchor="start">IX</text>
<text x="715" y="222" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="245" y="271" font-size="19" font-weight="700" fill="#163349" text-anchor="start">Tukey plot: simultaneous 95% intervals</text>
