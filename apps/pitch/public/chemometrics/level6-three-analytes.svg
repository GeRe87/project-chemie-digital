<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="290" viewBox="0 0 1100 290" role="img" aria-labelledby="t d"><title id="t">One water sample, replicate preparations, three analytical claims</title><desc id="d">One original water sample supplies six independent preparations. Each is measured for chloride, bromate and phosphate. Three resulting replicate series support separate mean-below-limit tests. Shared preparation errors may link the analytes.</desc><rect x="2" y="2" width="1096" height="286" rx="12" fill="#f4f8fc" stroke="#56809c"/>
