<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 550" font-family="system-ui, sans-serif">
<title>SPE recovery: compare methods within each matrix</title>
<desc>One Tukey plot compares six intervals on a shared axis, with river water and wastewater paired for each method contrast. Each matrix is a separate 95% family. Both use the full model residual MSE of 2 and 30 error degrees of freedom. River water: HSD 2.01 percentage points. A versus B, adjusted p 8.978e-05. A versus C, adjusted p 0.4482. B versus C, adjusted p 2.902e-06. Wastewater: HSD 2.01 percentage points. A versus B, adjusted p 1.029e-07. A versus C, adjusted p 0.05175. B versus C, adjusted p 2.185e-10.</desc>
<text x="20" y="34" font-size="26" font-weight="700" fill="#10698a" text-anchor="start">River water</text>
<text x="20" y="66" font-size="20" font-weight="700" fill="#5c3a98" text-anchor="start">HSD = 2.01 pp</text>
<text x="20" y="103" font-size="19" font-weight="700" fill="#163349" text-anchor="start">Matrix of adjusted p-values</text>
<text x="238" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">A</text>
<text x="364" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">B</text>
<text x="490" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">C</text>
<text x="20" y="162" font-size="19" font-weight="700" fill="#163349" text-anchor="start">A</text>
<text x="238" y="162" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="364" y="162" font-size="20" font-weight="700" fill="#a14518" text-anchor="middle">&lt;0.001</text>
<text x="490" y="162" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">0.448</text>
<text x="20" y="192" font-size="19" font-weight="700" fill="#163349" text-anchor="start">B</text>
<text x="364" y="192" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="490" y="192" font-size="20" font-weight="700" fill="#a14518" text-anchor="middle">&lt;0.001</text>
<text x="20" y="222" font-size="19" font-weight="700" fill="#163349" text-anchor="start">C</text>
<text x="490" y="222" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="600" y="34" font-size="26" font-weight="700" fill="#10698a" text-anchor="start">Wastewater</text>
<text x="600" y="66" font-size="20" font-weight="700" fill="#5c3a98" text-anchor="start">HSD = 2.01 pp</text>
<text x="600" y="103" font-size="19" font-weight="700" fill="#163349" text-anchor="start">Matrix of adjusted p-values</text>
<text x="818" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">A</text>
<text x="944" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">B</text>
<text x="1070" y="130" font-size="18" font-weight="700" fill="#10698a" text-anchor="middle">C</text>
<text x="600" y="162" font-size="19" font-weight="700" fill="#163349" text-anchor="start">A</text>
<text x="818" y="162" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="944" y="162" font-size="20" font-weight="700" fill="#a14518" text-anchor="middle">&lt;0.001</text>
<text x="1070" y="162" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">0.052</text>
<text x="600" y="192" font-size="19" font-weight="700" fill="#163349" text-anchor="start">B</text>
<text x="944" y="192" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="1070" y="192" font-size="20" font-weight="700" fill="#a14518" text-anchor="middle">&lt;0.001</text>
<text x="600" y="222" font-size="19" font-weight="700" fill="#163349" text-anchor="start">C</text>
<text x="1070" y="222" font-size="20" font-weight="400" fill="#163349" text-anchor="middle">—</text>
<text x="20" y="265" font-size="22" font-weight="700" fill="#163349" text-anchor="start">Tukey plot</text>
<text x="290" y="265" font-size="20" font-weight="650" fill="#10698a" text-anchor="start">● River water</text>
<text x="490" y="265" font-size="20" font-weight="650" fill="#5c3a98" text-anchor="start">● Wastewater</text>
