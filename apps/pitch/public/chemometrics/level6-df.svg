<svg xmlns="http://www.w3.org/2000/svg" width="960" height="280" viewBox="0 0 960 280" role="img" aria-labelledby="title desc">
<title id="title">Fitting a mean and fitting a line use different amounts of information</title><desc id="desc">Six observed points in each panel. The left panel fits a horizontal sample mean, estimating one parameter; the right fits a calibration line, estimating intercept and slope. Residual degrees of freedom are explained in the accompanying authored text.</desc>
<rect x="10" y="10" width="455" height="260" rx="12" fill="#edf6fc" stroke="#176da0"/><rect x="495" y="10" width="455" height="260" rx="12" fill="#f2edfa" stroke="#6943a6"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="21"><text x="35" y="45" font-weight="bold">FIT A MEAN</text><text x="520" y="45" font-weight="bold">FIT A CALIBRATION LINE</text><text x="35" y="247">1 estimated parameter: the mean</text><text x="520" y="247">2 estimated parameters: intercept + slope</text><text x="35" y="78" font-size="17">Six repeated concentrations</text><text x="520" y="78" font-size="17">Six calibration responses (schematic)</text></g>
<path d="M50 95V210H430M535 95V210H915" fill="none" stroke="#153147" stroke-width="2"/><path d="M60 145H420" stroke="#176da0" stroke-width="3"/><path d="M550 200L900 102" stroke="#6943a6" stroke-width="3"/>
<g fill="#176da0"><circle cx="90" cy="130" r="7"/><circle cx="150" cy="155" r="7"/><circle cx="210" cy="120" r="7"/><circle cx="270" cy="170" r="7"/><circle cx="330" cy="137" r="7"/><circle cx="390" cy="158" r="7"/></g><g fill="#6943a6"><circle cx="565" cy="195" r="7"/><circle cx="625" cy="190" r="7"/><circle cx="685" cy="151" r="7"/><circle cx="745" cy="150" r="7"/><circle cx="805" cy="117" r="7"/><circle cx="865" cy="122" r="7"/></g>
