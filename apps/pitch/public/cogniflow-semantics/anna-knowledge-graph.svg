<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 390" role="img" aria-labelledby="title desc">
  <title id="title">Knowledge graph connecting Anna, University, and Essen</title>
  <desc id="desc">Anna works at University and lives in Essen. University is located in Essen.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.6" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#351b56"/>
    </marker>
  </defs>

  <!-- Relationships -->
  <g fill="none" stroke="#351b56" stroke-width="5" stroke-linecap="square" stroke-linejoin="miter" marker-end="url(#arrow)">
    <path d="M138 106 L278 106"/>
    <path d="M112 146 L188 278"/>
    <path d="M310 146 L236 278"/>
  </g>

  <!-- Predicate labels -->
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="22" font-weight="800" text-anchor="middle" fill="#351b56">
    <rect x="169" y="80" width="82" height="36" fill="#efe1ff" stroke="#7046ad" stroke-width="4"/>
    <text x="210" y="105">worksAt</text>

    <rect x="82" y="201" width="82" height="36" fill="#efe1ff" stroke="#7046ad" stroke-width="4"/>
    <text x="123" y="226">livesIn</text>

    <rect x="256" y="201" width="116" height="36" fill="#efe1ff" stroke="#7046ad" stroke-width="4"/>
    <text x="314" y="226">locatedIn</text>
  </g>

  <!-- Entity nodes -->
  <g font-family="Cascadia Mono, Consolas, monospace" font-size="28" font-weight="900" text-anchor="middle" fill="#351b56">
    <rect x="28" y="66" width="128" height="80" fill="#f7efff" stroke="#7046ad" stroke-width="6"/>
    <text x="92" y="116">Anna</text>

    <rect x="264" y="66" width="138" height="80" fill="#f7efff" stroke="#7046ad" stroke-width="6"/>
    <text x="333" y="116">University</text>

    <rect x="143" y="278" width="136" height="82" fill="#f7efff" stroke="#7046ad" stroke-width="6"/>
    <text x="211" y="330">Essen</text>
  </g>
</svg>