low-explicit-context" data-resource-id="ex:diagram-state-cogniflow-explicit-context" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-motivation" data-relation-path="skos:prefLabel@en"><strong>Explicit processing context</strong></section></figure></article>
