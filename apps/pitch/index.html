nce-ids="https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-architecture" data-relation-path="skos:prefLabel@en">CogniFlow Orchestrator — data → Data Provider</li><li data-diagram-edge-id="ex:edge-cogniflow-orchestrator-artifacts" data-resource-id="ex:edge-cogniflow-orchestrator-artifacts" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-architecture" data-relation-path="skos:prefLabel@en">CogniFlow Orchestrator — artifacts → Artifact + Provenance Provider</li></ol></figure></article>

<article data-pitch-step="ex:scene-cogniflow-provenance-pipeline--scene" data-source-path-id="ex:path-cogniflow-standardized-data-processing" data-resource-id="ex:cogniflow-provenance-travels-with-data ex:scene-cogniflow-provenance-pipeline" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/cogniflow-provenance-pipeline https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-provenance-pipeline"><h2 data-resource-id="ex:cogniflow-provenance-travels-with-data" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-provenance-pipeline" data-relation-path="skos:prefLabel@en">The Result Carries Its History</h2><figure class="diagram-fallback" data-diagram-type="flow" data-focus-node-id="ex:node-cogniflow-prov-reusable" data-resource-id="ex:diagram-cogniflow-provenance-pipeline" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-provenance-pipeline" data-relation-path="cd:body skos:prefLabel@en"><figcaption><strong>Provenance as part of the result</strong> <span>Provenance is not a separate report added later. Each derived artifact keeps the input and processing context that produced it, so the final result remains traceable and reusable.</span></figcaption><ol class="diagram-nodes"><li data-diagram-node-id="ex:node-cogniflow-prov-input" data-resource-id="ex:node-cogniflow-prov-input" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-provenance-pipeline" data-relation-path="skos:prefLabel@en">INPUT DATA</li><li data-diagram-node-id="ex:node-cogniflow-prov-processing" data-resource-id="ex:node-cogniflow-prov-processing" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/cogniflow-provenance-pipeline" data-relation-path="skos:prefLabel@en">PROCESSING · method + version + parameters</li><li data-diagram-node-id="ex:node-cogniflow-prov-derived" data-resource-id="ex:node-cogniflow-prov-der
