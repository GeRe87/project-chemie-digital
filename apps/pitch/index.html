        <h1 id="pitch-static-title">Chemie digital – Studiendekanat-Pitch</h1>
        <p>Statische, vollständig lesbare Fassung in der akzeptierten neun-stufigen Reihenfolge.</p>
        <article data-pitch-step="pitch-step-context"><h2>Chemie digital denken – Wissen zuerst</h2><p>Der Studiendekanat-Pitch ist als erste durchgängige Anwendung vorgesehen und soll die geplante Plattformarchitektur anhand semantischer Inhalte, einer pfadgesteuerten Struktur und mehrerer erzeugter Ansichten demonstrieren.</p><p>Früher Chemieanker: Wiederholte Messungen liefern nicht exakt denselben Wert – ihre Streuung wird zum sichtbaren Beispiel für wiederverwendbares Fachwissen.</p></article>
        <article data-pitch-step="pitch-step-knowledge-first"><h2>Die Wissensbasis ist primär</h2><p>Die Plattform behandelt wissenschaftliche Konzepte, wiederverwendbare Lernressourcen und ihre Beziehungen als primäre Wissensbasis. Präsentationsansichten werden daraus erzeugt und sind nicht die alleinige Quelle des Inhalts.</p><p>Lehrinhalte können aktualisiert werden, ohne jede Präsentation separat zu überarbeiten.</p></article>
        <article data-pitch-step="pitch-step-semantic-resources"><h2>Semantische Ressourcen</h2><p>Definitionen, mathematische Ausdrücke, Symbole, Beispiele, Übungen und Quellen sind adressierbare semantische Ressourcen, die in unterschiedlichen Lehr- und Ausgabeformaten wiederverwendet werden können.</p><p>Eine fachlich geprüfte Definition bleibt über Vorlesung, Selbstlernen und Wissensnetzwerk hinweg identisch referenzierbar.</p></article>
        <article data-pitch-step="pitch-step-paths"><h2>Pfade ordnen Wissen für einen Zweck</h2><p>Didaktische und narrative Pfade wählen semantische Ressourcen aus und ordnen sie für einen konkreten Lehr-, Selbstlern- oder Präsentationszweck, ohne Renderer-Komponenten festzulegen.</p><p>Dasselbe Wissen kann für Erstsemester anders sequenziert werden als für eine Vertiefungsveranstaltung.</p></article>
        <article data-pitch-step="pitch-step-scenes"><h2>Komposition ohne Renderer-Abhängigkeit</h2><p>Eine deterministische Kompositionsschicht überführt aufgelöste Pfade in rendererneutrale Szenendokumente und bewahrt dabei semantische Identitäten, Provenienz und Barrierefreiheitsinformationen.</p><p>Lesereihenfolge, Herkunft und Textalternativen bleiben auch beim Wechsel des Ausgabekanals erhalten.</p></article>
        <article data-pitch-step="pitch-step-renderer-boundary"><h2>Reveal.js bleibt ein austauschbarer Renderer</h2><p>Konkrete Präsentationstechnologien bleiben hinter nachgelagerten Renderer-Adaptern gekapselt. Das Domänenmodell, die Pfadauflösung und die Szenenkomposition bleiben von einem einzelnen Ausgabekanal unabhängig.</p><p>Die Fachinhalte müssen nicht an Folien-HTML oder eine einzelne Präsentationssoftware gekoppelt werden.</p></article>
        <article data-pitch-step="pitch-step-output-channels"><h2>Eine Wissensbasis – mehrere Ausgaben</h2><p>Dieselbe semantische Wissensbasis kann für Live-Präsentationen, Selbstlernansichten, Wissensnetzwerke sowie Druck- und spätere offene Bildungsformate genutzt werden.</p><p>Fachliche Pflege wird gebündelt, während die Darstellung an Nutzungssituationen angepasst bleibt.</p></article>
        <article data-pitch-step="pitch-step-proof"><h2>Proof of Concept: Standardabweichung</h2><p>Der technische Machbarkeitsnachweis nutzt die Standardabweichung als semantisch modelliertes Beispiel mit Definition, Formel, Symbolen, Beispielen, Übung, Lernpfad, Szenenkomposition und Wissensnetzwerkprojektion.</p><p>Präzision beschreibt die Streuung wiederholter Messungen; sie ist nicht gleichbedeutend mit Richtigkeit oder Freiheit von systematischen Fehlern.</p></article>
        <article data-pitch-step="pitch-step-next-step"><h2>Nächster Schritt: gemeinsam am realen Lehrformat prüfen</h2><p>Der Studiendekanat-Pitch ist als erste durchgängige Anwendung vorgesehen und soll die geplante Plattformarchitektur anhand semantischer Inhalte, einer pfadgesteuerten Struktur und mehrerer erzeugter Ansichten demonstrieren.</p><p>Die sichtbare Vertikalscheibe schafft eine konkrete Grundlage für technische, Datenschutz- und Barrierefreiheitsreviews sowie die spätere Verbindung mit der vollständigen semantischen Pipeline.</p></article>
