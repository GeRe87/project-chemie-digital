        <path d="m868 64 23 19 24-19" fill="none" stroke="#207350" stroke-width="3"/>
        <path d="M1025 293v-45q0-37 39-37h65q37 0 37 37v45z" fill="#d9ede5" stroke="#207350" stroke-width="4"/>
        <path d="M1111 293v-45q0-36 24-36m-90 37h53m-27 44v25m-17 0h35" fill="none" stroke="#207350" stroke-width="4"/>
        <circle cx="1088" cy="274" r="4.5" fill="#207350"/>
