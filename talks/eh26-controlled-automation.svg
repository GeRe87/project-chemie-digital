          <circle r="10" fill="#e7dff5"/>
        </g>
      </g>
      <g transform="translate(631 276)">
        <g>
          <title>Turn counterclockwise</title>
          <path d="M-5-24H5l2 7 6 3 7-2 6 8-5 6v5l5 6-6 8-7-2-6 3-2 7H-5l-2-7-6-3-7 2-6-8 5-6v-5l-5-6 6-8 7 2 6-3z" fill="#604493"/>
