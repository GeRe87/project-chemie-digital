<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 410">
  <title>Follow the evidence behind an SBR result</title>
  <desc>A reported SBR result links to the ion trace and marker area, the calibration standards and model, and the processing settings and software version. Persistent identifiers, access and licensing support reuse.</desc>
