<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 445" role="img" aria-labelledby="title desc" lang="de">
  <title id="title">PLS-DA-Zuordnung neuer Bromthymolblau-Proben</title>
  <desc id="desc">Die Gerade schätzt für Probe 1 den Klassenwert 0,18 und für Probe 2 den Klassenwert 0,87. Die Schwelle 0,5 ordnet Probe 1 als sauer und Probe 2 als basisch ein.</desc>
