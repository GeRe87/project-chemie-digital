<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 445" role="img" aria-labelledby="title desc">
  <title id="title">Geplante Beiträge aus Industrie und angewandter Forschung</title>
  <desc id="desc">Henkel in Düsseldorf steht für digitalisierte Forschung, Entwicklung und Produktion. Das IUTA in Duisburg zeigt digitale Laborumgebungen. Geplant sind ein Gastbeitrag von Ricardo Cunha im Modul und Exkursionen im Ergänzungsbereich.</desc>
