<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 620" role="img" aria-labelledby="title desc" lang="de">
  <title id="title">Vom Sensorbeispiel zum eigenen Projekt</title>
  <desc id="desc">Fünf Kursphasen zeigen, wie Vorlesung, betreute Übung und Live-Labs auf das Einzelprojekt vorbereiten. Woche 1: Die Lehrenden führen Minireaktor und Roboterarm vor und stellen das Projektziel vor. Beide Geräte dienen in späteren Vorlesungen als Demonstrationssysteme. In den Live-Labs arbeiten die Studierenden selbst damit. Die Studierenden lesen eine Beispielkurve. Wochen 2 bis 4: FAIR, Formate und Schnittstellen. Eine Messdatei im Notebook einlesen und Einheiten prüfen. In Woche 4 dokumentieren die Studierenden die Quelle und Einheit ihres Projektsignals. Wochen 5 bis 8: Messqualität und PCA an Spektren aus dem Handheld-Raman. In der Übung Messlücken und auffällige Werte untersuchen. Das Sensor-Lab am Minireaktor findet in Woche 7 und 8 je zwei Stunden statt. Im Projekt das bereitgestellte Live-Signal abrufen und erste Werte prüfen. Wochen 9 bis 11: Automatisierung und KI. In der Übung Werte nach Regeln prüfen und mit Zeitstempel speichern. Das Roboter-Lab findet in Woche 10 statt und dauert zwei Stunden. Im Projekt das eigene Signal automatisch verarbeiten und speichern. Wochen 12 bis 14: Ergebnisse bewerten, Code und Ergebnis mit Tutorinnen und Tutoren prüfen. Die Studierenden dokumentieren ihre Lösung und stellen sie auf einem Poster im Kurzpitch vor. Kalenderbeispiel Sommersemester 2027 vom 5. April bis 16. Juli: nach Feiertagen und Pfingstferien montags 14, dienstags 14, mittwochs 15, donnerstags 13 und freitags 15 regelmäßige Termine. Der Dies academicus ist bei der Belegung zu berücksichtigen.</desc>
