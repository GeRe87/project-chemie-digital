<article data-pitch-step="ex:scene-chemometrics-mean-values-arithmetic-mean--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:arithmetic-mean ex:scene-chemometrics-mean-values-arithmetic-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples https://w3id.org/project-chemie-digital/graph/specifications/standard-deviation"><h2 data-resource-id="ex:arithmetic-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples https://w3id.org/project-chemie-digital/graph/specifications/standard-deviation" data-relation-path="skos:prefLabel@en">arithmetic mean</h2><div class="math-fallback" role="math" aria-label="Mathematische Formel für arithmetic mean" data-resource-id="ex:arithmetic-mean-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:latex"><code>\bar{x} = \frac{1}{n} \sum_{i=1}^{n} x_i</code></div><dl class="definition-list-fallback" data-resource-id="ex:arithmetic-mean-formula ex:arithmetic-mean-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-arithmetic-1--definition-entry" data-resource-id="ex:mv-legend-arithmetic-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>x̄, xᵢ</dt><dd>Arithmetic sample mean and observation i, in the same unit.</dd></div><div data-definition-entry-id="ex:mv-legend-arithmetic-2--definition-entry" data-resource-id="ex:mv-legend-arithmetic-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>n, i, Σ</dt><dd>Sample size, observation index and sum over equally weighted numerical observations with meaningful addition. Normality is not required.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-arithmetic-calculation--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:arithmetic-mean ex:scene-chemometrics-mean-values-arithmetic-calculation" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples https://w3id.org/project-chemie-digital/graph/specifications/standard-deviation"><h2 data-resource-id="ex:mean-dice-average-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Average five observed sums</h2><blockquote class="lead" data-resource-id="ex:mean-dice-average-context" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body">Average five observed experiment sums, not all possible outcomes. The sample result need not equal the model expectation 17.5.</blockquote><div class="math-fallback" role="math" aria-label="The arithmetic sample mean is the sum of n observations divided by n. Substitute the five experiment sums 10, 13, 18, 10 and 23. Their sum is 74, and 74 divided by 5 equals 14.8." data-resource-id="ex:mean-dice-average-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}\bar{x}&amp;=\frac{\sum_{i=1}^{n}x_i}{n}\\&amp;=\frac{10+13+18+10+23}{5}\\&amp;=\frac{74}{5}=14.8\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-dice-average-formula ex:mean-dice-average-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-dice-average-symbol--definition-entry" data-resource-id="ex:mean-dice-average-symbol" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>x̄, xᵢ</dt><dd>Average and observed sum from experiment i, not individual die faces.</dd></div><div data-definition-entry-id="ex:mean-dice-average-size--definition-entry" data-resource-id="ex:mean-dice-average-size" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>n, i, Σ</dt><dd>Five equally weighted experiments; i indexes them; Σ adds their sums.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-dice-practice--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:arithmetic-mean ex:scene-chemometrics-mean-values-dice-practice" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples https://w3id.org/project-chemie-digital/graph/specifications/standard-deviation"><h2 data-resource-id="ex:mean-dice-practice-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Average five repeated experiments</h2><div class="prompt-fallback" data-resource-id="ex:mean-dice-practice ex:mean-dice-practice-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body"><p><strong>Repeat the five-dice experiment five times.</strong></p><ul class="teaching-points"><li data-marker-purpose="task"><span class="teaching-point-marker" aria-hidden="true"></span>List the sums and calculate their arithmetic mean.</li><li data-marker-purpose="task"><span class="teaching-point-marker" aria-hidden="true"></span>Explain why a finite sample average need not equal 17.5.</li></ul></div><section class="code-function-workbench-fallback" role="group" aria-label="Code and function glossary"><div class="code-fallback" data-code-block-id="ex:mv-dice-practice-3--block" data-language="r" data-resource-id="ex:mean-dice-practice-r" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasCodeExample"><pre><code>set.seed(42)
sums &lt;- replicate(5, sum(sample(1:6, 5, replace = TRUE)))
list(sums = sums, mean = mean(sums))</code></pre></div><dl class="definition-list-fallback" tabindex="0" aria-label="Scrollable authored function glossary" data-resource-id="ex:mean-dice-practice-r ex:mean-dice-practice-r-functions" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-dice-practice-fn-seed--definition-entry" data-resource-id="ex:mean-dice-practice-fn-seed" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>set.seed(seed)</dt><dd>Makes the pseudorandom draws reproducible.</dd></div><div data-definition-entry-id="ex:mean-dice-practice-fn-replicate--definition-entry" data-resource-id="ex:mean-dice-practice-fn-replicate" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>replicate(n, expr)</dt><dd>Evaluates expr n times and collects each experiment sum.</dd></div><div data-definition-entry-id="ex:mean-dice-practice-fn-sample--definition-entry" data-resource-id="ex:mean-dice-practice-fn-sample" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>sample(x, size, replace)</dt><dd>Draws five die faces from 1:6 with replacement.</dd></div><div data-definition-entry-id="ex:mean-dice-practice-fn-sum--definition-entry" data-resource-id="ex:mean-dice-practice-fn-sum" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>sum(x)</dt><dd>Adds the five faces within one experiment.</dd></div><div data-definition-entry-id="ex:mean-dice-practice-fn-mean--definition-entry" data-resource-id="ex:mean-dice-practice-fn-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>mean(x)</dt><dd>Calculates the arithmetic mean of the five experiment sums.</dd></div><div data-definition-entry-id="ex:mean-dice-practice-fn-list--definition-entry" data-resource-id="ex:mean-dice-practice-fn-list" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>list(...)</dt><dd>Returns the named sums and their mean together.</dd></div></dl></section></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-lln-practice--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:law-of-large-numbers ex:scene-chemometrics-mean-values-lln-practice" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-lln-practice-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Repeat the experiment more often</h2><div class="prompt-fallback" data-resource-id="ex:mean-lln-practice ex:mean-lln-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body"><p><strong>Compare averages from 5, 50 and 50,000 independent five-dice experiments.</strong></p><ul class="teaching-points"><li data-marker-purpose="task"><span class="teaching-point-marker" aria-hidden="true"></span>Change the seed and repeat.</li><li data-marker-purpose="question"><span class="teaching-point-marker" aria-hidden="true"></span>Does every larger sample have to be closer to 17.5?</li></ul></div><section class="code-function-workbench-fallback" role="group" aria-label="Code and function glossary"><div class="code-fallback" data-code-block-id="ex:mv-lln-practice-3--block" data-language="r" data-resource-id="ex:mean-lln-practice-r" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasCodeExample"><pre><code>set.seed(42)
sums &lt;- replicate(50000, sum(sample(1:6, 5, replace = TRUE)))
n &lt;- c(5, 50, 50000)
data.frame(n, mean = sapply(n, function(k) mean(sums[seq_len(k)])))</code></pre></div><dl class="definition-list-fallback" tabindex="0" aria-label="Scrollable authored function glossary" data-resource-id="ex:mean-lln-practice-r ex:mean-lln-practice-r-functions" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-lln-fn-seed--definition-entry" data-resource-id="ex:mean-lln-fn-seed" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>set.seed(seed)</dt><dd>Fixes the pseudorandom sequence for reproducible comparisons.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-replicate--definition-entry" data-resource-id="ex:mean-lln-fn-replicate" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>replicate(n, expr)</dt><dd>Repeats the five-dice experiment 50,000 times.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-sample--definition-entry" data-resource-id="ex:mean-lln-fn-sample" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>sample(x, size, replace)</dt><dd>Draws five fair-die outcomes for each experiment.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-sum--definition-entry" data-resource-id="ex:mean-lln-fn-sum" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>sum(x)</dt><dd>Adds the five outcomes in each repeated experiment.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-data-frame--definition-entry" data-resource-id="ex:mean-lln-fn-data-frame" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>data.frame(...)</dt><dd>Combines the repetition counts and their calculated averages as columns.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-sapply--definition-entry" data-resource-id="ex:mean-lln-fn-sapply" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>sapply(x, function)</dt><dd>Applies the supplied calculation to each repetition count.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-function--definition-entry" data-resource-id="ex:mean-lln-fn-function" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>function(k)</dt><dd>Defines a small calculation that receives one repetition count k.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-seq-len--definition-entry" data-resource-id="ex:mean-lln-fn-seq-len" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>seq_len(k)</dt><dd>Selects the first k experiment sums without exceeding the available data.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-mean--definition-entry" data-resource-id="ex:mean-lln-fn-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>mean(x)</dt><dd>Calculates the arithmetic mean of the selected experiment sums.</dd></div><div data-definition-entry-id="ex:mean-lln-fn-c--definition-entry" data-resource-id="ex:mean-lln-fn-c" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>c(...)</dt><dd>Combines the three repetition counts into one vector.</dd></div></dl></section></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-water--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:arithmetic-mean ex:scene-chemometrics-mean-values-water" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples https://w3id.org/project-chemie-digital/graph/specifications/standard-deviation"><h2 data-resource-id="ex:mean-water-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Arithmetic means in water analysis</h2><ul class="keypoint-list" data-resource-id="ex:mean-water-summary" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasKeyPoint"><li data-list-item-id="ex:mean-water-oxygen-result--list-item" data-resource-id="ex:mean-water-oxygen-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body">Oxygen: 8.6 mg/L</li><li data-list-item-id="ex:mean-water-nitrate-result--list-item" data-resource-id="ex:mean-water-nitrate-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body">Nitrate: 3.4 mg/L</li><li data-list-item-id="ex:mean-water-iron-result--list-item" data-resource-id="ex:mean-water-iron-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body">Iron: 5.0 mg/L</li></ul><figure class="table-fallback" data-resource-id="ex:mean-water-table" data-provenance-ids="https://w3id.org/project-che <article data-pitch-step="ex:scene-chemometrics-mean-values-growth--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-growth" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-growth-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Growth combines by multiplication</h2><figure class="diagram-fallback" data-diagram-type="flow" data-resource-id="ex:mean-growth-diagram" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><figcaption><strong>Counts over two equal growth periods</strong> <span>100 cells grow by factor 2 to 200, then by factor 8 to 1600. The two intervals have equal duration.</span></figcaption><ol class="diagram-nodes"><li data-diagram-node-id="ex:mean-growth-start" data-resource-id="ex:mean-growth-start" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en">100 CELLS</li><li data-diagram-node-id="ex:mean-growth-middle" data-resource-id="ex:mean-growth-middle" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en">200 CELLS</li><li data-diagram-node-id="ex:mean-growth-end" data-resource-id="ex:mean-growth-end" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en">1600 CELLS</li></ol><ol class="diagram-edges"><li data-diagram-edge-id="ex:mean-growth-edge-1" data-resource-id="ex:mean-growth-edge-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">100 CELLS — × 2 → 200 CELLS</li><li data-diagram-edge-id="ex:mean-growth-edge-2" data-resource-id="ex:mean-growth-edge-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">200 CELLS — × 8 → 1600 CELLS</li></ol></figure><figure class="media-reference-fallback" data-media-block-id="ex:mv-growth-media--block" data-media-type="image/svg+xml" data-resource-id="ex:mean-cell-growth-sketch" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:alternativeText cd:mediaType cd:uri"><img src="/chemometrics/mean-values-cell-growth.svg" alt="Illustrative cell populations over two equal periods: 100, then 200 (factor 2), then 1600 (factor 8). Cell symbols represent populations, not individual counts." /></figure></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-growth-comparison--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-growth-comparison" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-growth-comparison-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Does arithmetic preserve growth?</h2><dl class="definition-list-fallback" data-resource-id="ex:mean-growth-arithmetic-cards" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry"><div data-definition-entry-id="ex:mean-growth-arithmetic-card--definition-entry" data-resource-id="ex:mean-growth-arithmetic-card" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>ARITHMETIC FACTOR</dt><dd>Which constant factor reproduces 1600 cells from 100 in two equal periods?
Apply it twice: 100 × m × m = 100m².
Factor 5 predicts 2500 ≠ observed 1600.
The arithmetic mean fails this growth question.</dd></div></dl><div class="math-fallback" role="math" aria-label="The arithmetic average factor is 5. One constant factor must be applied in each of two equal periods. Applying 5 twice to 100 predicts 2500, whereas the observed factors 2 and 8 give 1600 cells. The arithmetic mean fails to preserve this growth." data-resource-id="ex:mean-growth-arithmetic-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}A&amp;=(2+8)/2=5\\100\times5^2&amp;=2500\ne100\times2\times8=1600\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-growth-arithmetic-formula ex:mean-growth-arithmetic-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-growthA-1--definition-entry" data-resource-id="ex:mv-legend-growthA-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>A</dt><dd>Arithmetic average of growth factors 2 and 8: A = 5.</dd></div><div data-definition-entry-id="ex:mv-legend-growthA-2--definition-entry" data-resource-id="ex:mv-legend-growthA-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>100, 2</dt><dd>Initial count 100; exponent 2 applies one factor over two equal periods.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-geometric-mean--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-geometric-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:geometric-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">geometric mean</h2><div class="math-fallback" role="math" aria-label="Mathematische Formel für geometric mean" data-resource-id="ex:geometric-mean-product-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:latex"><code>G = \left(\prod_{i=1}^{n} x_i\right)^{1/n}, \qquad x_i &gt; 0</code></div><dl class="definition-list-fallback" data-resource-id="ex:geometric-mean-product-formula ex:geometric-mean-product-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-product-1--definition-entry" data-resource-id="ex:mv-legend-product-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>G, xᵢ</dt><dd>Geometric mean and positive input i.</dd></div><div data-definition-entry-id="ex:mv-legend-product-2--definition-entry" data-resource-id="ex:mv-legend-product-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>n, i, Π</dt><dd>Number of inputs, index and product over the inputs.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-growth-calculation--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-growth-calculation" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-growth-calculation-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Preserve the growth product</h2><dl class="definition-list-fallback" data-resource-id="ex:mean-growth-geometric-cards" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry"><div data-definition-entry-id="ex:mean-growth-geometric-card--definition-entry" data-resource-id="ex:mean-growth-geometric-card" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>GEOMETRIC FACTOR</dt><dd>Same question: one constant factor for two equal periods.
Apply factor 4 twice to the initial 100 cells.
Predicted 1600 = observed 1600.
The geometric mean preserves this growth.</dd></div></dl><div class="math-fallback" role="math" aria-label="The geometric average factor is 4. Applying it in each of two equal periods predicts 1600 cells, matching the observed final count from 100 times 2 times 8." data-resource-id="ex:mean-growth-geometric-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}G&amp;=\sqrt{2\times8}=4\\100\times4^2&amp;=1600=100\times2\times8\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-growth-geometric-formula ex:mean-growth-geometric-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-growthG-1--definition-entry" data-resource-id="ex:mv-legend-growthG-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>G</dt><dd>Equivalent factor 4 per equal period preserves the product 2 × 8.</dd></div><div data-definition-entry-id="ex:mv-legend-growthG-2--definition-entry" data-resource-id="ex:mv-legend-growthG-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>100, 2</dt><dd>Initial count 100; two equal periods lead to 1600 cells.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-growth-r--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-growth-r" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-growth-r-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Reproduce growth in R</h2><div class="prompt-fallback" data-resource-id="ex:mean-growth-r-practice ex:mean-growth-r-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body"><p><strong>Start with 100 cells and growth factors 2 and 8 over two equal periods.</strong></p><ul class="teaching-points"><li data-marker-purpose="task"><span class="teaching-point-marker" aria-hidden="true"></span>Calculate the geometric factor and use it twice to reconstruct the final count.</li></ul></div><section class="code-function-workbench-fallback" role="group" aria-label="Code and function glossary"><div class="code-fallback" data-code-block-id="ex:mv-growth-r-3--block" data-language="r" data-resource-id="ex:mean-growth-r" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasCodeExample"><pre><code>factors &lt;- c(2, 8)
g &lt;- prod(factors)^(1 / length(factors))
list(geometric = g, final_cells = 100 * g^length(factors))</code></pre></div><dl class="definition-list-fallback" tabindex="0" aria-label="Scrollable authored function glossary" data-resource-id="ex:mean-growth-r ex:mean-growth-r-functions" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-growth-fn-c--definition-entry" data-resource-id="ex:mean-growth-fn-c" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>c(...)</dt><dd>Combines the two positive growth factors into a vector.</dd></div><div data-definition-entry-id="ex:mean-growth-fn-prod--definition-entry" data-resource-id="ex:mean-growth-fn-prod" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>prod(x)</dt><dd>Multiplies the factors to obtain their total multiplier.</dd></div><div data-definition-entry-id="ex:mean-growth-fn-length--definition-entry" data-resource-id="ex:mean-growth-fn-length" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>length(x)</dt><dd>Counts the factors, here the two equal-duration periods.</dd></div><div data-definition-entry-id="ex:mean-growth-fn-list--definition-entry" data-resource-id="ex:mean-growth-fn-list" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>list(...)</dt><dd>Returns the geometric factor and reconstructed final count together.</dd></div></dl></section></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-log--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-log" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-log-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Average on a logarithmic scale</h2><div class="math-fallback" role="math" aria-label="Mathematische Formel für geometric mean" data-resource-id="ex:geometric-mean-log-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:latex"><code>G = \exp\left(\frac{1}{n}\sum_{i=1}^{n}\ln x_i\right), \qquad x_i &gt; 0</code></div><dl class="definition-list-fallback" data-resource-id="ex:geometric-mean-log-formula ex:geometric-mean-log-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-log-1--definition-entry" data-resource-id="ex:mv-legend-log-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>G, xᵢ</dt><dd>Geometric mean and positive input i.</dd></div><div data-definition-entry-id="ex:mv-legend-log-2--definition-entry" data-resource-id="ex:mv-legend-log-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>n, ln, exp</dt><dd>Number of inputs, natural logarithm and inverse exponential.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-microbial--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-microbial" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-microbial-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Two summaries of microbial counts</h2><dl class="definition-list-fallback" data-resource-id="ex:mean-microbial-arithmetic-cards" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry"><div data-definition-entry-id="ex:mean-microbial-arithmetic-card--definition-entry" data-resource-id="ex:mean-microbial-arithmetic-card" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>ARITHMETIC: PULLED UPWARD</dt><dd>10, 100, 10,000 counts per 100 mL
The extreme 10,000 strongly raises the mean to 3370.
Not a suitable typical value for this log-scale question.</dd></div></dl><div class="math-fallback" role="math" aria-label="The arithmetic mean count is 3370 per 100 millilitres." data-resource-id="ex:mean-microbial-arithmetic-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}A&amp;=\frac{10+100+10000}{3}\\&amp;=3370\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-microbial-arithmetic-formula ex:mean-microbial-arithmetic-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-countA-1--definition-entry" data-resource-id="ex:mv-legend-countA-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>A</dt><dd>Arithmetic mean of the three equally weighted counts.</dd></div><div data-definition-entry-id="ex:mv-legend-countA-2--definition-entry" data-resource-id="ex:mv-legend-countA-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>10, 100, 10000</dt><dd>Illustrative counts per 100 mL; result has the same unit.</dd></div></dl><dl class="definition-list-fallback" data-resource-id="ex:mean-microbial-geometric-cards" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry"><div data-definition-entry-id="ex:mean-microbial-geometric-card--definition-entry" data-resource-id="ex:mean-microbial-geometric-card" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>GEOMETRIC: LOG-SCALE CENTER</dt><dd>Give equal weight to logarithms of positive counts.
215.44 per 100 mL better describes this log-scale center.
Keep the extreme observation; neither center establishes safety.</dd></div></dl><div class="math-fallback" role="math" aria-label="The geometric mean count is approximately 215.44 per 100 millilitres." data-resource-id="ex:mean-microbial-geometric-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}G&amp;=\sqrt[3]{10\times100\times10000}\\&amp;\approx215.44\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-microbial-geometric-formula ex:mean-microbial-geometric-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-countG-1--definition-entry" data-resource-id="ex:mv-legend-countG-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>G, ∛</dt><dd>Geometric mean of three positive counts; ∛ is the cube root.</dd></div><div data-definition-entry-id="ex:mv-legend-countG-2--definition-entry" data-resource-id="ex:mv-legend-countG-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>10, 100, 10000</dt><dd>Illustrative counts per 100 mL; result has the same unit.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-ratios--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:geometric-mean ex:scene-chemometrics-mean-values-ratios" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-ratios-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Summarize proportional changes</h2><dl class="definition-list-fallback" data-resource-id="ex:mean-ratios-arithmetic-cards" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry"><div data-definition-entry-id="ex:mean-ratios-arithmetic-card--definition-entry" data-resource-id="ex:mean-ratios-arithmetic-card" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>ARITHMETIC: TOO HIGH FOR THIS QUESTION</dt><dd>Three concentration comparisons: 0.5, 2, 5 (dimensionless).
2.5 exceeds the equal-log-weight center 1.710.
It does not preserve the product: 2.5³ = 15.625, not 5.</dd></div></dl><div class="math-fallback" role="math" aria-label="The arithmetic average of the three ratios is 2.5." data-resource-id="ex:mean-ratios-arithmetic-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>A=(0.5+2+5)/3=2.5</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-ratios-arithmetic-formula ex:mean-ratios-arithmetic-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-ratioA-1--definition-entry" data-resource-id="ex:mv-legend-ratioA-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>A</dt><dd>Arithmetic mean of three equally weighted ratios.</dd></div><div data-definition-entry-id="ex:mv-legend-ratioA-2--definition-entry" data-resource-id="ex:mv-legend-ratioA-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>0.5, 2, 5</dt><dd>Illustrative dimensionless ratios.</dd></div></dl><dl class="definition-list-fallback" data-resource-id="ex:mean-ratios-geometric-cards" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry"><div data-definition-entry-id="ex:mean-ratios-geometric-card--definition-entry" data-resource-id="ex:mean-ratios-geometric-card" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>GEOMETRIC: PRESERVES THE PRODUCT</dt><dd>The cube root of 5 matches the equal-log-weight question.
G³ = 0.5 × 2 × 5 = 5.
These are concentration comparisons, not successive growth periods.</dd></div></dl><div class="math-fallback" role="math" aria-label="The geometric average ratio is approximately 1.710, corresponding to about a 71 percent increase under equal log weighting." data-resource-id="ex:mean-ratios-geometric-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>G=\sqrt[3]{0.5\times2\times5}\approx1.710</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-ratios-geometric-formula ex:mean-ratios-geometric-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-ratioG-1--definition-entry" data-resource-id="ex:mv-legend-ratioG-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>G, ∛</dt><dd>Equivalent factor with equal logarithmic weight; cube root for three inputs.</dd></div><div data-definition-entry-id="ex:mv-legend-ratioG-2--definition-entry" data-resource-id="ex:mv-legend-ratioG-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>0.5, 2, 5</dt><dd>Positive dimensionless input ratios.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-speed--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:harmonic-mean ex:scene-chemometrics-mean-values-speed" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-speed-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Two equal distances, two speeds</h2><section class="group-fallback" role="group" data-resource-id="ex:mean-speed-question" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body dct:hasPart"><div class="prompt-fallback" data-resource-id="ex:mean-speed-question ex:mean-speed-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body"><p>A tracer travels 100 m at 10 m/s and another 100 m at 2 m/s. What is total distance divided by total time? Compare with the arithmetic average of the speeds.</p></div><figure class="media-reference-fallback" data-media-block-id="ex:mv-speed-2--block--ex:mean-journey-sketch" data-media-type="image/svg+xml" data-resource-id="ex:mean-journey-sketch ex:mean-speed-question" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:alternativeText cd:uri dct:hasPart"><img src="/chemometrics/mean-values-journey.svg" alt="Start, junction and end mark two equal 100 m sections, travelled at 10 and 2 m/s in the same direction." /></figure></section></article>

Predicted 33.33 s ≠ actual 60 s.</dd></div></dl><div class="math-fallback" role="math" aria-label="The arithmetic speed is 6 metres per second. At that constant speed, 200 metres would take about 33.33 seconds rather than 60 seconds." data-resource-id="ex:mean-speed-arithmetic-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}A&amp;=(10+2)/2=6\;\mathrm{m/s}\\t_A&amp;=200/6\approx33.33\;\mathrm{s}\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-speed-arithmetic-formula ex:mean-speed-arithmetic-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-speed-A-legend-1--definition-entry" data-resource-id="ex:mean-speed-A-legend-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>A</dt><dd>Arithmetic average of the two speeds, in m/s.</dd></div><div data-definition-entry-id="ex:mean-speed-A-legend-2--definition-entry" data-resource-id="ex:mean-speed-A-legend-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>t_A, 200 m</dt><dd>Predicted journey time if both 100 m sections were travelled at A.</dd></div></dl><dl class="definition-list-fallback" data-resource-id="ex:mean-speed-geometric-cards" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry"><div data-definition-entry-id="ex:mean-speed-geometric-card--definition-entry" data-resource-id="ex:mean-speed-geometric-card" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>GEOMETRIC CANDIDATE</dt><dd>A product of speeds answers a different question.
Predicted 44.72 s ≠ actual 60 s.</dd></div></dl><div class="math-fallback" role="math" aria-label="The geometric speed is square root of 20, about 4.472 metres per second. At that constant speed, 200 metres would take about 44.72 seconds rather than 60 seconds." data-resource-id="ex:mean-speed-geometric-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}G&amp;=\sqrt{10\times2}\approx4.472\;\mathrm{m/s}\\t_G&amp;=200/\sqrt{20}\approx44.72\;\mathrm{s}\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-speed-geometric-formula ex:mean-speed-geometric-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-speed-G-legend-1--definition-entry" data-resource-id="ex:mean-speed-G-legend-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>G</dt><dd>Geometric average of the two positive speeds, in m/s.</dd></div><div data-definition-entry-id="ex:mean-speed-G-legend-2--definition-entry" data-resource-id="ex:mean-speed-G-legend-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>t_G, 200 m</dt><dd>Predicted journey time at constant speed G over the total distance.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-harmonic-mean--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:harmonic-mean ex:scene-chemometrics-mean-values-harmonic-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:harmonic-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">harmonic mean</h2><blockquote class="lead" data-resource-id="ex:mean-harmonic-context" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body">For positive rates over equal quantities, add the corresponding times. Equal times instead imply arithmetic averaging of rates.</blockquote><div class="math-fallback" role="math" aria-label="Mathematische Formel für harmonic mean" data-resource-id="ex:harmonic-mean-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:latex"><code>H = \frac{n}{\sum_{i=1}^{n} 1/x_i}</code></div><dl class="definition-list-fallback" data-resource-id="ex:harmonic-mean-formula ex:harmonic-mean-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-harmonic-1--definition-entry" data-resource-id="ex:mv-legend-harmonic-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>H, xᵢ</dt><dd>Harmonic mean and nonzero input i; rate examples use positive values.</dd></div><div data-definition-entry-id="ex:mv-legend-harmonic-2--definition-entry" data-resource-id="ex:mv-legend-harmonic-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>n, Σ 1/xᵢ</dt><dd>n counts the inputs; add their reciprocals. For speeds in m/s, 1/xᵢ is time per metre (s/m), so H is again in m/s.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-speed-solution--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:harmonic-mean ex:scene-chemometrics-mean-values-speed-solution" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-speed-solution-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Harmonic speed, then total time</h2><div class="math-fallback" role="math" aria-label="For two equal 100 metre sections at positive speeds 10 and 2 metres per second, the harmonic speed is two divided by the sum of the reciprocal speeds, exactly ten thirds metres per second, approximately 3.333 metres per second." data-resource-id="ex:mean-speed-harmonic-calculation" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}v_H&amp;=\frac{2}{1/10+1/2}\\&amp;=\frac{10}{3}\;\mathrm{m/s}\\&amp;\approx3.333\;\mathrm{m/s}\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-speed-harmonic-calculation ex:mean-speed-harmonic-calculation-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-speed-H-symbol--definition-entry" data-resource-id="ex:mean-speed-H-symbol" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>v_H</dt><dd>Harmonic speed in m/s; use exact 10/3 for the next calculation.</dd></div><div data-definition-entry-id="ex:mean-speed-H-inputs--definition-entry" data-resource-id="ex:mean-speed-H-inputs" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>2, 10, 2</dt><dd>Two equal 100 m sections; positive speeds 10 and 2 m/s.</dd></div></dl><div class="math-fallback" role="math" aria-label="The total journey time is total distance d divided by harmonic speed v H. Two 100 metre sections give 200 metres; dividing by exact ten thirds metres per second gives exactly 60 seconds. Using rounded 3.333 metres per second would give only an approximate time." data-resource-id="ex:mean-speed-total-time-calculation" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\begin{aligned}t&amp;=\frac{d}{v_H}\\&amp;=\frac{200}{10/3}\\&amp;=60\;\mathrm{s}\end{aligned}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-speed-total-time-calculation ex:mean-speed-total-time-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-speed-time-symbol--definition-entry" data-resource-id="ex:mean-speed-time-symbol" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>t</dt><dd>Total journey time in seconds, not one section time.</dd></div><div data-definition-entry-id="ex:mean-speed-distance-symbol--definition-entry" data-resource-id="ex:mean-speed-distance-symbol" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>d, v_H</dt><dd>Total distance 100 + 100 = 200 m; exact speed 10/3 m/s.</dd></div></dl></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-speed-r--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:harmonic-mean ex:scene-chemometrics-mean-values-speed-r" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-speed-r-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Reproduce the journey in R</h2><section class="group-fallback" role="group" data-resource-id="ex:mean-speed-r-practice" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body dct:hasPart"><div class="prompt-fallback" data-resource-id="ex:mean-speed-r-practice ex:mean-speed-r-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body"><p><strong>Travel two equal 100 m sections at 10 and 2 m/s.</strong></p><ul class="teaching-points"><li data-marker-purpose="task"><span class="teaching-point-marker" aria-hidden="true"></span>Calculate section times, total time and overall speed.</li><li data-marker-purpose="task"><span class="teaching-point-marker" aria-hidden="true"></span>Check that the harmonic mean gives the same overall speed.</li></ul></div><figure class="media-reference-fallback" data-media-block-id="ex:mv-speed-r-2--block--ex:mean-journey-sketch" data-media-type="image/svg+xml" data-resource-id="ex:mean-journey-sketch ex:mean-speed-r-practice" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:alternativeText cd:uri dct:hasPart"><img src="/chemometrics/mean-values-journey.svg" alt="Start, junction and end mark two equal 100 m sections, travelled at 10 and 2 m/s in the same direction." /></figure></section><section class="code-function-workbench-fallback" role="group" aria-label="Code and function glossary"><div class="code-fallback" data-code-block-id="ex:mv-speed-r-3--block" data-language="r" data-resource-id="ex:mean-speed-r" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasCodeExample"><pre><code>speeds &lt;- c(10, 2)
distances &lt;- rep(100, 2)
times &lt;- distances / speeds
list(times_s = times, total_time_s = sum(times),
     overall_m_s = sum(distances) / sum(times),
     harmonic_m_s = 1 / mean(1 / speeds))</code></pre></div><dl class="definition-list-fallback" tabindex="0" aria-label="Scrollable authored function glossary" data-resource-id="ex:mean-speed-r ex:mean-speed-r-functions" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-speed-fn-c--definition-entry" data-resource-id="ex:mean-speed-fn-c" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>c(...)</dt><dd>Combines the two section speeds into a vector.</dd></div><div data-definition-entry-id="ex:mean-speed-fn-rep--definition-entry" data-resource-id="ex:mean-speed-fn-rep" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>rep(x, times)</dt><dd>Repeats 100 m twice to represent equal section distances.</dd></div><div data-definition-entry-id="ex:mean-speed-fn-sum--definition-entry" data-resource-id="ex:mean-speed-fn-sum" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>sum(x)</dt><dd>Adds section distances or travel times to their journey totals.</dd></div><div data-definition-entry-id="ex:mean-speed-fn-mean--definition-entry" data-resource-id="ex:mean-speed-fn-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>mean(x)</dt><dd>Averages reciprocal speeds; taking its reciprocal gives the harmonic mean.</dd></div><div data-definition-entry-id="ex:mean-speed-fn-list--definition-entry" data-resource-id="ex:mean-speed-fn-list" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>list(...)</dt><dd>Returns named times and speeds together, with units in their names.</dd></div></dl></section></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-harmonic-practice--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:harmonic-mean ex:scene-chemometrics-mean-values-harmonic-practice" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-harmonic-practice-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Pump three equal volumes</h2><section class="group-fallback" role="group" data-resource-id="ex:mean-harmonic-practice" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body dct:hasPart"><div class="prompt-fallback" data-resource-id="ex:mean-harmonic-practice ex:mean-harmonic-result" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body"><p>Pump three successive 10 L batches at 10, 2 and 5 L/min. Calculate each pumping time and the overall rate as total volume divided by total time.</p></div><figure class="media-reference-fallback" data-media-block-id="ex:mv-harmonic-practice-2--block--ex:mean-pumping-sketch" data-media-type="image/svg+xml" data-resource-id="ex:mean-harmonic-practice ex:mean-pumping-sketch" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:alternativeText cd:uri dct:hasPart"><img src="/chemometrics/mean-values-pumping.svg" alt="Three successive 10 L batches pumped at 10, 2 and 5 L/min. Equal volumes do not imply equal pumping times." /></figure></section><section class="code-function-workbench-fallback" role="group" aria-label="Code and function glossary"><div class="code-fallback" data-code-block-id="ex:mv-harmonic-practice-3--block" data-language="r" data-resource-id="ex:mean-harmonic-r" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasCodeExample"><pre><code>rates &lt;- c(10, 2, 5)
volumes &lt;- rep(10, 3)
times &lt;- volumes / rates
list(times = times,
     overall = sum(volumes) / sum(times),
     harmonic = 1 / mean(1 / rates),
     arithmetic = mean(rates))</code></pre></div><dl class="definition-list-fallback" tabindex="0" aria-label="Scrollable authored function glossary" data-resource-id="ex:mean-harmonic-r ex:mean-harmonic-r-functions" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-harmonic-fn-c--definition-entry" data-resource-id="ex:mean-harmonic-fn-c" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>c(...)</dt><dd>Combines the three rates into a vector.</dd></div><div data-definition-entry-id="ex:mean-harmonic-fn-rep--definition-entry" data-resource-id="ex:mean-harmonic-fn-rep" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>rep(x, times)</dt><dd>Repeats a batch volume three times, matching one batch to each rate.</dd></div><div data-definition-entry-id="ex:mean-harmonic-fn-sum--definition-entry" data-resource-id="ex:mean-harmonic-fn-sum" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>sum(x)</dt><dd>Adds all batch volumes or all pumping times.</dd></div><div data-definition-entry-id="ex:mean-harmonic-fn-mean--definition-entry" data-resource-id="ex:mean-harmonic-fn-mean" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>mean(x)</dt><dd>Calculates the arithmetic mean, here for comparison with overall rate.</dd></div><div data-definition-entry-id="ex:mean-harmonic-fn-list--definition-entry" data-resource-id="ex:mean-harmonic-fn-list" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>list(...)</dt><dd>Returns the named times and rates together.</dd></div></dl></section></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-layers--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:harmonic-mean ex:scene-chemometrics-mean-values-layers" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-layers-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: Diffusion through equal layers</h2><blockquote class="lead" data-resource-id="ex:mean-layers-assumptions" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body">Idealized steady-state model: equal thickness and area, layers in series, no reaction or partition discontinuity.</blockquote><div class="math-fallback" role="math" aria-label="The effective diffusion coefficient for this equal-layer model is approximately 1.99 times ten to the minus eight square metres per second." data-resource-id="ex:mean-layers-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>D_{\mathrm{eff}}=\frac{2}{1/(2\times10^{-6})+1/(10^{-8})}\approx1.99\times10^{-8}\;\mathrm{m^2/s}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-layers-formula ex:mean-layers-formula-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mv-legend-layers-1--definition-entry" data-resource-id="ex:mv-legend-layers-1" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>Dₑff</dt><dd>Effective diffusion coefficient in m²/s for two equal series layers.</dd></div><div data-definition-entry-id="ex:mv-legend-layers-2--definition-entry" data-resource-id="ex:mv-legend-layers-2" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><dt>D₁, D₂</dt><dd>2 × 10⁻⁶ and 10⁻⁸ m²/s; equal thickness/area, steady state, no reaction or partition jump.</dd></div></dl><figure class="diagram-fallback" data-diagram-type="flow" data-resource-id="ex:mean-layers-diagram" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en"><figcaption><strong>Diffusion resistances in series</strong> <span>Flux passes through two equal-thickness layers with equal area. At steady state the same flux crosses both; their resistances add.</span></figcaption><ol class="diagram-nodes"><li data-diagram-node-id="ex:mean-layer-fast" data-resource-id="ex:mean-layer-fast" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en">LAYER 1</li><li data-diagram-node-id="ex:mean-layer-slow" data-resource-id="ex:mean-layer-slow" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body skos:prefLabel@en">LAYER 2</li></ol><ol class="diagram-edges"><li data-diagram-edge-id="ex:mean-layer-flux" data-resource-id="ex:mean-layer-flux" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">LAYER 1 — same steady flux → LAYER 2</li></ol></figure></article>
<article data-pitch-step="ex:scene-chemometrics-mean-values-turbidity--scene" data-source-path-id="ex:path-chemometrics-mean-values-lecture" data-resource-id="ex:median ex:scene-chemometrics-mean-values-turbidity" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/scenes/chemometrics-mean-values-lecture https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-basics https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples"><h2 data-resource-id="ex:mean-turbidity-heading" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="skos:prefLabel@en">Example: One large turbidity measurement</h2><blockquote class="lead" data-resource-id="ex:mean-turbidity-slide-context" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body">NTU = nephelometric turbidity units (light scattering). The extreme 45.0 NTU strongly pulls the arithmetic mean above the four values around 2.0 to 2.3 NTU. The event is not automatically invalid; keep it visible.</blockquote><div class="math-fallback" role="math" aria-label="All five observed turbidity values sum to 53.6 NTU. Their equally weighted arithmetic mean is 53.6 divided by 5, equal to 10.72 NTU." data-resource-id="ex:mean-turbidity-average-formula" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:body cd:latex"><code>\bar{x}=\frac{53.6}{5}=10.72\;\mathrm{NTU}</code></div><dl class="definition-list-fallback" data-resource-id="ex:mean-turbidity-average-formula ex:mean-turbidity-average-legend" data-provenance-ids="https://w3id.org/project-chemie-digital/graph/specifications/chemometrics-mean-values-examples" data-relation-path="cd:hasDefinitionListEntry dct:hasPart"><div data-definition-entry-id="ex:mean-turbidity-av
