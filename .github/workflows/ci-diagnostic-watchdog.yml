name: CI Diagnostic Watchdog

on:
  workflow_run:
    workflows:
      - Validate
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

env:
  CI_DIAGNOSTIC_MARKER: '<!-- project-chemie-digital-ci-diagnostic -->'

jobs:
  publish-fallback:
    if: ${{ github.event.workflow_run.conclusion != 'success' && github.event.workflow_run.event == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Publish fallback diagnostic when primary evidence is missing
        uses: actions/github-script@v7
        env:
          DIAGNOSTIC_MARKER: ${{ env.CI_DIAGNOSTIC_MARKER }}
        with:
          script: |
            const marker = process.env.DIAGNOSTIC_MARKER;
            const run = context.payload.workflow_run;
            const { owner, repo } = context.repo;

            let pullRequests = run.pull_requests ?? [];
            if (pullRequests.length === 0) {
              pullRequests = await github.paginate(
                github.rest.repos.listPullRequestsAssociatedWithCommit,
                { owner, repo, commit_sha: run.head_sha, per_page: 100 },
              );
            }

            if (pullRequests.length === 0) {
              core.notice(`No pull request is associated with failed run ${run.id}.`);
              return;
            }

            const jobs = await github.paginate(
              github.rest.actions.listJobsForWorkflowRun,
              { owner, repo, run_id: run.id, per_page: 100 },
            );

            const jobLines = jobs.map((job) => {
              const steps = job.steps ?? [];
              if (steps.length === 0) {
                return `- \`${job.name}\`: \`${job.conclusion ?? job.status}\`; no step metadata was returned`;
              }
              const failedSteps = steps
                .filter((step) => step.conclusion && step.conclusion !== 'success' && step.conclusion !== 'skipped')
                .map((step) => `${step.name} (${step.conclusion})`);
              return `- \`${job.name}\`: \`${job.conclusion ?? job.status}\`; ${failedSteps.length ? `failed steps: ${failedSteps.join(', ')}` : 'no failed step was identified'}`;
            });

            const body = [
              marker,
              '## CI diagnostic fallback',
              '',
              `- Workflow: \`${run.name}\``,
              `- Run: \`#${run.run_number}\``,
              `- Attempt: \`${run.run_attempt ?? 'unknown'}\``,
              `- Commit: \`${run.head_sha}\``,
              `- Conclusion: \`${run.conclusion}\``,
              `- Event: \`${run.event}\``,
              '',
              '### Job metadata',
              ...(jobLines.length ? jobLines : ['- GitHub returned no job records for this run.']),
              '',
              '### Classification',
              'The primary validation workflow failed without publishing a connector-readable diagnostic for this exact run and commit. This is CI infrastructure or Actions-metadata evidence, not proof of a repository-test failure. Start a fresh validation run rather than making speculative source changes.',
            ].join('\n');

            for (const pullRequest of pullRequests) {
              const issue_number = pullRequest.number;
              const comments = await github.paginate(
                github.rest.issues.listComments,
                { owner, repo, issue_number, per_page: 100 },
              );
              const previous = comments.find((comment) => comment.body && comment.body.includes(marker));
              const hasCurrentPrimaryEvidence = previous?.body?.includes(`Run: \`#${run.run_number}\``)
                && previous.body.includes(`Commit: \`${run.head_sha}\``)
                && !previous.body.includes('CI diagnostic fallback');

              if (hasCurrentPrimaryEvidence) {
                core.notice(`Primary diagnostic already exists for PR #${issue_number}, run #${run.run_number}.`);
                continue;
              }

              if (previous) {
                await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
              } else {
                await github.rest.issues.createComment({ owner, repo, issue_number, body });
              }
            }
