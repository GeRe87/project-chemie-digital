<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="title description">
  <title id="title">Small and larger illustrative spread</title>
  <desc id="description">Two illustrative target patterns, centered by construction. Crosses have smaller spread; open circles have larger spread. The target center is a reference, not a validation of trueness of the QC methods.</desc>
  <metadata>Canonical sources: ex:uq-target-a, ex:uq-target-b in variance-components-and-replication.trig. x = center + 100 xValue; y = 180 - 100 numericValue. Schematic coordinates, not QC measurements.</metadata>
  <rect width="640" height="380" fill="#f4f7fa"/>
  <g fill="none" stroke="currentColor" stroke-width="2" opacity="0.65">
    <circle cx="160" cy="180" r="20"/><circle cx="160" cy="180" r="50"/><circle cx="160" cy="180" r="80"/>
    <circle cx="480" cy="180" r="20"/><circle cx="480" cy="180" r="50"/><circle cx="480" cy="180" r="80"/>
    <path d="M70 180H250M160 90V270M390 180H570M480 90V270" stroke-dasharray="4 5"/>
  </g>
  <g stroke="currentColor" stroke-width="4" fill="none">
    <path data-observation="uq-ta1" d="M144 184l8 8m-8 0l8-8"/>
    <path data-observation="uq-ta2" d="M168 168l8 8m-8 0l8-8"/>
    <path data-observation="uq-ta3" d="M148 164l8 8m-8 0l8-8"/>
    <path data-observation="uq-ta4" d="M164 188l8 8m-8 0l8-8"/>
    <circle data-observation="uq-tb1" cx="410" cy="225" r="7"/>
    <circle data-observation="uq-tb2" cx="550" cy="135" r="7"/>
    <circle data-observation="uq-tb3" cx="435" cy="110" r="7"/>
    <circle data-observation="uq-tb4" cx="525" cy="250" r="7"/>
  </g>
  <g fill="currentColor" font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="160" y="40" font-size="25">Small illustrative spread</text>
    <text x="480" y="40" font-size="25">Larger illustrative spread</text>
    <text x="320" y="315" font-size="22">Both patterns are centered by construction.</text>
    <text x="320" y="348" font-size="22">Spread only: this does not establish method trueness.</text>
  </g>
</svg>
