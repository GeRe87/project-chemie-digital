<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 560" role="img" aria-labelledby="title desc">
<title id="title">Chi-square five-degree reference: observed 12 exceeds the 5% cutoff</title><desc id="desc">Reference at true SD equal to 0.10 mg/L. Dashed line at 11.0704977 marks the upper five-percent critical value; solid orange line at observed statistic twelve. The orange right-tail probability from twelve to infinity is 0.0347878, about 3.48 percent. Shading stops at the drawing boundary 32, while the theoretical tail continues.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.axis{fill:none;stroke:#294f60;stroke-width:3}.curve{fill:none;stroke:#007c91;stroke-width:4}.shade{fill:#d77a21;opacity:.65}.cut{stroke:#59737c;stroke-width:3;stroke-dasharray:8 6}.observed{stroke:#a25920;stroke-width:4}.leader{fill:none;stroke:#a25920;stroke-width:2}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.axis{stroke:#c0dbe5}.curve{stroke:#7bd9e3}.shade{fill:#ffad61}.cut{stroke:#c0dbe5}.observed,.leader{stroke:#ffc083}}</style>
<rect class="bg" width="760" height="560" rx="18"/>
<g class="ink" text-anchor="middle" font-size="26"><text x="380" y="36">Reference: chi-square, 5 degrees of freedom</text><text x="380" y="74">Dashed cutoff: 11.0705 | observed statistic: 12</text></g>
<path class="shade" d="M325 420V395.336L362.5 408.566L400 414.861L475 419.028L550 419.827L625 419.971L700 419.995V420Z"/>
<path class="axis" d="M100 110V420H715"/>
