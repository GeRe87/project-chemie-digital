<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
 <title id="title">Dilution and photometric concentration determination</title>
 <desc id="desc">Pipette ten millilitres from a collected sample, dilute to one hundred millilitres, then measure absorbance in a cuvette. Signal and volume uncertainty propagate into the original sample concentration.</desc>
 <style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.line{fill:none;stroke:#245565;stroke-width:4}.water{fill:#7ec7d5}.glass{fill:#e2f0f4;stroke:#245565;stroke-width:4}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.line{stroke:#b2d9e6}.water{fill:#5ab6ca}.glass{fill:#294d59;stroke:#b2d9e6}}</style>
 <rect class="bg" width="1200" height="430" rx="18"/>
 <g class="ink" text-anchor="middle" font-size="33" font-weight="700"><text x="205" y="54">1. Pipette</text><text x="600" y="54">2. Dilute</text><text x="995" y="54">3. Measure</text></g>
