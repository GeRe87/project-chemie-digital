 <g class="ink" text-anchor="middle" font-size="30"><text x="205" y="350">10.00 mL sample</text><text x="600" y="350">100.00 mL final</text><text x="995" y="350">Absorbance 0.200</text><text x="600" y="405" font-size="26">Target: concentration in the collected sample, not a water-body mean</text></g>
