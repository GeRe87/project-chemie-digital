<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540" role="img" aria-labelledby="title desc">
<title id="title">Two methods: compare measurement scatter</title>
<desc id="desc">Two schematic measurement series use the same horizontal concentration scale and have the same mean. Method A's six results are widely spread; method B's six results cluster closely around the mean. A vertical dashed line marks their common mean. The question concerns spread, not a difference between means. These positions are illustrative, not the observations of the worked precision example.</desc>
<rect x="2" y="2" width="996" height="536" rx="18" fill="#f4f8fc" stroke="#56809c" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle">
<text x="500" y="52" font-size="30" font-weight="bold">COMPARE MEASUREMENT SCATTER</text>
<text x="600" y="105" font-size="24">Same mean</text>
<g text-anchor="start" font-size="27" font-weight="bold"><text x="38" y="170">Method A</text><text x="38" y="340">Method B</text></g>
<g text-anchor="start" font-size="23"><text x="38" y="204">Wider spread</text><text x="38" y="374">Narrower spread</text></g>
<text x="600" y="462" font-size="27">Concentration (same scale)</text>
<text x="500" y="511" font-size="22">Schematic measurements, not the worked dataset</text>
</g>
<g stroke="#56809c" stroke-width="3" fill="none"><path d="M255 220H945M255 390H945"/><path d="M255 213V227M945 213V227M255 383V397M945 383V397"/></g>
<path d="M600 119V407" stroke="#56809c" stroke-width="3" stroke-dasharray="8 7"/>
<g fill="#8754ae" stroke="#153147" stroke-width="2"><circle cx="300" cy="180" r="10"/><circle cx="420" cy="180" r="10"/><circle cx="540" cy="180" r="10"/><circle cx="660" cy="180" r="10"/><circle cx="780" cy="180" r="10"/><circle cx="900" cy="180" r="10"/></g>
<g fill="#277ba2" stroke="#153147" stroke-width="2"><circle cx="540" cy="350" r="10"/><circle cx="564" cy="350" r="10"/><circle cx="588" cy="350" r="10"/><circle cx="612" cy="350" r="10"/><circle cx="636" cy="350" r="10"/><circle cx="660" cy="350" r="10"/></g>
</svg>
