<title id="t">From experimental vessels to table rows and columns</title><desc id="d">Allocate forty independent vessels to control and exposure, twenty each. Vessels are drawn above the table. Classify each vessel once as affected or unaffected. Group determines the row; classification determines the column. Control counts 8 and 12; exposure 14 and 6. Row totals 20 and 20; column totals 22 and 18; grand total 40.</desc>
<rect x="2" y="2" width="1096" height="716" rx="14" fill="#f4f8fc" stroke="#56809c"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle"><text x="550" y="43" font-size="30" font-weight="bold">ALLOCATE 40 INDEPENDENT VESSELS</text><text x="275" y="85" font-size="26" font-weight="bold">CONTROL · 20 vessels</text><text x="825" y="85" font-size="26" font-weight="bold">EXPOSURE · 20 vessels</text></g>
<g fill="#a4d7e8" stroke="#21475d" stroke-width="3"><path d="M152 108H202L199 162H155ZM222 108H272L269 162H225ZM292 108H342L339 162H295ZM362 108H412L409 162H365Z"/><path d="M702 108H752L749 162H705ZM772 108H822L819 162H775ZM842 108H892L889 162H845ZM912 108H962L959 162H915Z"/></g>
<g fill="#8550a7"><circle cx="723" cy="138" r="9"/><circle cx="793" cy="138" r="9"/><circle cx="863" cy="138" r="9"/><circle cx="933" cy="138" r="9"/></g>
<path d="M275 174V194H550V212M825 174V194H550" fill="none" stroke="#56809c" stroke-width="3"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle" font-size="25"><text x="550" y="242" font-weight="bold">Classify each vessel once: affected OR unaffected</text><text x="550" y="279">Treatment group → row · Damage classification → column</text></g>
<g fill="#e0edf6" stroke="#56809c" stroke-width="2"><rect x="55" y="310" width="990" height="280"/><path d="M55 380H1045M55 450H1045M55 520H1045M330 310V590M570 310V590M810 310V590"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle" font-size="27"><text x="450" y="355">Affected</text><text x="690" y="355">Unaffected</text><text x="925" y="355">Row total Rᵢ</text><text x="190" y="425">Control</text><text x="450" y="425">8</text><text x="690" y="425">12</text><text x="925" y="425">20</text><text x="190" y="495">Exposure</text><text x="450" y="495">14</text><text x="690" y="495">6</text><text x="925" y="495">20</text><text x="190" y="565">Column total Cⱼ</text><text x="450" y="565">22</text><text x="690" y="565">18</text><text x="925" y="565">N = 40</text><text x="550" y="640">Expected count: row total × column total ÷ grand total</text><text x="550" y="687">Control / affected → 20 × 22 ÷ 40 = 11</text></g></svg>
