<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="t d"><title id="t">Adding one curve coefficient to the same ten standards</title><desc id="d">For a straight line with two coefficients residual sum of squares is 12; a curve with three gives 5. Proportional bars have lengths 432 and 180. One added term removes 7 squared-error units; full residual degrees of freedom ν = 7. Model shapes are schematic.</desc><rect x="2" y="2" width="656" height="436" rx="14" fill="#f4f8fc" stroke="#56809c"/><rect x="150" y="110" width="432" height="34" fill="#277ba2"/><rect x="150" y="205" width="180" height="34" fill="#8754ae"/><path d="M70 350L190 290M260 350Q350 350 390 285" stroke="#7545a0" stroke-width="4" fill="none"/><g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="22"><text x="330" y="40" text-anchor="middle" font-weight="bold">SAME TEN CALIBRATION STANDARDS</text><text x="35" y="84">Line · 2 coefficients</text><text x="35" y="184">Curve · 3 coefficients</text><text x="598" y="137">12</text><text x="348" y="232">5</text><text x="430" y="310">Gain: 7</text><text x="430" y="350">Full ν: 7</text><text x="330" y="405" text-anchor="middle" font-size="19">RSS bars share one scale · model shapes only</text></g></svg>
