<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="t d"><title id="t">Independent upstream and downstream samples</title><desc id="d">A river passes an industrial park. Three independently sampled sites upstream and three different sites downstream represent separate sampling units, not matched pairs. A common within-region variance needs prior scientific justification.</desc><rect x="2" y="2" width="656" height="436" rx="14" fill="#f4f8fc" stroke="#56809c"/><path d="M35 243Q180 155 310 247T625 242" fill="none" stroke="#4ba1c2" stroke-width="44"/><path d="M285 178V90L335 118V90L395 122V65H425V178Z" fill="#7545a0"/><g fill="#277ba2" stroke="#fff" stroke-width="3"><circle cx="70" cy="223" r="12"/><circle cx="130" cy="207" r="12"/><circle cx="195" cy="207" r="12"/></g><g fill="#ab5c25" stroke="#fff" stroke-width="3"><circle cx="470" cy="288" r="12"/><circle cx="535" cy="278" r="12"/><circle cx="595" cy="258" r="12"/></g><g fill="#153147" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="22"><text x="330" y="40" font-weight="bold">DICLOFENAC: TWO REGIONS</text><text x="127" y="155">Upstream</text><text x="530" y="195">Downstream</text><text x="355" y="205">Industrial park</text><text x="330" y="350">Different sites, not paired readings</text><text x="330" y="391" font-size="19">Assume independent sampling within each region</text></g></svg>
