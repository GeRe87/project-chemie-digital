<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="title desc">
<title id="title">A conceptual triangular density and its integrated cumulative function</title>
<desc id="desc">Not a fit to the twenty nitrate readings, and not a normal model. A symmetric triangular density on 10 minus five sixths to 10 plus five sixths mg/L has peak 1.2 L/mg and total area one. The associated CDF is quadratic on each side of concentration ten and is steepest where density is greatest. Its value at ten is one half. Both x axes show concentration in mg/L; PDF ordinate is L/mg, CDF ordinate is dimensionless probability.</desc>
<style>text{font-family:system-ui,sans-serif;fill:#17354b;font-size:19px}.axis{stroke:#38596a;stroke-width:2;fill:none}.curve{stroke:#086a91;stroke-width:4;fill:none}.shade{fill:#1689ab;fill-opacity:.18}.mark{fill:#a23c20}.small{font-size:16px}@media(prefers-color-scheme:dark){text{fill:#e5f1fa}.axis{stroke:#b8cedd}.curve{stroke:#69ceef}.shade{fill:#69ceef}.mark{fill:#ffba87}}</style>
<text x="45" y="27">PDF: where probability concentrates</text><text x="490" y="27">CDF: how much has accumulated</text>
<text class="small" x="45" y="57">Density f(x) in L/mg</text><text class="small" x="490" y="57">Cumulative probability F(x), unit 1</text>
<path class="axis" d="M45 250H425 M60 250V70 M490 250H870 M500 250V70"/>
<path class="shade" d="M60 250L230 70L400 250Z"/>
<path class="curve" d="M45 250H60L230 70L400 250H425 M490 250H500Q585 250 670 160Q755 70 840 70H870"/>
<circle class="mark" cx="230" cy="70" r="5"/><circle class="mark" cx="670" cy="160" r="5"/>
<text x="245" y="90">1.2</text><text x="675" y="148">0.5</text><text x="475" y="82">1</text><text x="475" y="249">0</text>
<text class="small" x="48" y="276">9.17</text><text class="small" x="219" y="276">10</text><text class="small" x="380" y="276">10.83</text>
<text class="small" x="486" y="276">9.17</text><text class="small" x="659" y="276">10</text><text class="small" x="820" y="276">10.83</text>
<text class="small" x="105" y="304">Concentration x (mg/L)</text><text class="small" x="550" y="304">Concentration threshold x (mg/L)</text>
<text class="small" x="45" y="340">Conceptual continuous model, not fitted to the 20 readings. Rounded support labels; no normal assumption.</text>
</svg>
