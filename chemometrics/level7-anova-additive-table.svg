<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="system-ui, sans-serif">
  <title>Build the additive ANOVA table</title>
  <desc>Additive ANOVA table. Method: SS 14, df 2, MS 7, F 0.663, p 0.5224, eta squared 2.69%. Matrix: SS 169, df 1, MS 169, F 16, p 0.000350, eta squared 32.44%. Residual: SS 338, df 32, MS 10.5625. Total: SS 521, df 35. Eta squared is the share of total SS associated with each factor.</desc>
