<rect x="622" y="25" width="326" height="248" fill="#a14518" fill-opacity=".11"/>
<text x="669" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#a14518">F</text>
<text x="669" y="110" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">0.663</text>
<text x="669" y="160" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">16.000</text>
