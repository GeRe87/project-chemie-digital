  <text x="66" y="55" text-anchor="start" font-size="22" font-weight="700" fill="#163349">Source</text>
  <text x="66" y="110" text-anchor="start" font-size="23" font-weight="500" fill="#163349">Method</text>
  <text x="66" y="160" text-anchor="start" font-size="23" font-weight="500" fill="#163349">Matrix</text>
  <text x="66" y="210" text-anchor="start" font-size="23" font-weight="500" fill="#163349">Residual</text>
  <text x="66" y="260" text-anchor="start" font-size="23" font-weight="500" fill="#163349">Total</text>
  <text x="349" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#10698a">SS</text>
  <text x="349" y="110" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">14</text>
  <text x="349" y="160" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">169</text>
  <text x="349" y="210" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">338</text>
  <text x="349" y="260" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">521</text>
  <g data-svg-stage="1">
<rect x="413" y="25" width="98" height="248" fill="#5c3a98" fill-opacity=".11"/>
<text x="462" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#5c3a98">df</text>
<text x="462" y="110" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">2</text>
