<text x="53" y="301" text-anchor="start" font-size="20" font-weight="700" fill="#5c3a98">df: method 3 − 1 · matrix 2 − 1 · residual 35 − 2 − 1</text>
</g>
  <g data-svg-stage="2">
<rect x="515" y="25" width="104" height="248" fill="#10698a" fill-opacity=".11"/>
<text x="565" y="55" text-anchor="middle" font-size="22" font-weight="700" fill="#10698a">MS</text>
<text x="565" y="110" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">7</text>
<text x="565" y="160" text-anchor="middle" font-size="23" font-weight="500" fill="#163349">169</text>
