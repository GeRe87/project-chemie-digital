<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 490" style="color-scheme: light dark; color: light-dark(#172a3b, #e3edf7)" data-teaching-stage-count="1" data-teaching-stage-mode="cumulative">
<title>How does the concentration fall over time?</title><desc>Five measurements of dissolved tracer in mg/L, from 19.60 at zero minutes to 4.12 at four minutes. The first reveal compares the drops over the first and last minutes: 5.65 versus 1.67 mg/L.</desc>
