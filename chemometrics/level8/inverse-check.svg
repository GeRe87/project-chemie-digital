<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="2" data-teaching-stage-mode="cumulative">
<title>inverse check</title><desc>The dimensionless matrix [[2,1],[1,1]], its inverse [[1,-1],[-1,2]], and their identity product. Stage 1 adds the inverse; stage 2 adds the identity.</desc>
<g><text x="90" y="90" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">matrix</text><path d="M 88 155 h -10 v 128 h 10 M 216 155 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="100" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">2</text><text x="164" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text><text x="100" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text><text x="164" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text></g><g data-svg-stage="1"><text x="410" y="90" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">inverse</text><path d="M 418 155 h -10 v 128 h 10 M 546 155 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="430" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text><text x="494" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">-1</text><text x="430" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">-1</text><text x="494" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">2</text></g><g data-svg-stage="2"><text x="730" y="90" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">product</text><path d="M 738 155 h -10 v 128 h 10 M 866 155 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="750" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text><text x="814" y="190" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">0</text><text x="750" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">0</text><text x="814" y="254" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text></g></svg>