<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="3" data-teaching-stage-mode="cumulative">
<title>model workflow</title><desc>A four-step horizontal workflow: choose known terms, build rows and columns, minimise squared residuals, read fitted values. Stages 1, 2, 3 reveal one subsequent step each. Uncertainty is deliberately left for the next appointment.</desc>
<g><text x="60" y="180" font-size="27" fill="currentColor" font-family="system-ui, sans-serif">1. Choose terms</text></g><g data-svg-stage="1"><text x="310" y="180" font-size="27" fill="currentColor" font-family="system-ui, sans-serif">2. Build X</text></g><g data-svg-stage="2"><text x="540" y="180" font-size="27" fill="currentColor" font-family="system-ui, sans-serif">3. Minimise</text></g><g data-svg-stage="3"><text x="760" y="180" font-size="27" fill="currentColor" font-family="system-ui, sans-serif">4. Predict</text></g><text x="100" y="320" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">Model terms are known. Coefficients are fitted.</text></svg>