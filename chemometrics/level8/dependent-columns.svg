<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="1" data-teaching-stage-mode="cumulative">
<title>dependent columns</title><desc>Two parallel column arrows point in the same direction; the second is twice the first. Stage 1 adds two different coefficient choices with the same combined column, so the coefficients cannot be identified uniquely.</desc>
<g><path d="M160 400 H800 M160 400 V80" stroke="currentColor" fill="none" stroke-width="2" /><path d="M160 400 L320 240" stroke="var(--pcd-accent)" fill="none" stroke-width="4" /><path d="M160 400 L480 80" stroke="var(--pcd-chart-series-2)" fill="none" stroke-width="4" /><text x="340" y="250" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">first column</text><text x="500" y="100" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">twice the first</text></g><g data-svg-stage="1"><text x="500" y="350" font-size="24" fill="currentColor" font-family="system-ui, sans-serif">Same direction, not new information.</text></g></svg>