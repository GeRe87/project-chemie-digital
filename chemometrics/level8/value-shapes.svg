<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="2" data-teaching-stage-mode="cumulative">
<title>value shapes</title><desc>A scalar 5, a three-entry column vector, and a two-row three-column matrix, arranged left to right. Stages 1 and 2 add vector and matrix to the scalar.</desc>
<g><text x="100" y="120" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">scalar</text><text x="140" y="270" font-size="52" fill="currentColor" font-family="system-ui, sans-serif">5</text></g><g data-svg-stage="1"><text x="340" y="120" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">column vector</text><path d="M 398 165 h -10 v 192 h 10 M 462 165 h 10 v 192 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="410" y="200" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text><text x="410" y="264" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">2</text><text x="410" y="328" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">3</text></g><g data-svg-stage="2"><text x="690" y="120" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">matrix</text><path d="M 718 165 h -10 v 128 h 10 M 910 165 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="730" y="200" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text><text x="794" y="200" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">2</text><text x="858" y="200" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">3</text><text x="730" y="264" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">4</text><text x="794" y="264" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">5</text><text x="858" y="264" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">6</text></g></svg>