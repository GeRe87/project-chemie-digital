<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" data-teaching-stage-count="2" data-teaching-stage-mode="cumulative">
<title>row dot column</title><desc>Matrix A has rows [1,2] and [3,4]; B has rows [5,6] and [7,8]. Stage 1 highlights A row 1 and B column 2; stage 2 gives 1 times 6 plus 2 times 8 equals 22 in product row 1 column 2.</desc>
<g><text x="140" y="70" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">A</text><path d="M 128 115 h -10 v 128 h 10 M 256 115 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="140" y="150" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">1</text><text x="204" y="150" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">2</text><text x="140" y="214" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">3</text><text x="204" y="214" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">4</text><text x="470" y="70" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">B</text><path d="M 458 115 h -10 v 128 h 10 M 586 115 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="470" y="150" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">5</text><text x="534" y="150" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">6</text><text x="470" y="214" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">7</text><text x="534" y="214" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">8</text><text x="780" y="70" font-size="26" fill="currentColor" font-family="system-ui, sans-serif">AB</text></g><g data-svg-stage="1"><path d="M130 125 H265 M545 112 V225" stroke="var(--pcd-chart-series-2)" fill="none" stroke-width="4" /></g><g data-svg-stage="2"><path d="M 758 115 h -10 v 128 h 10 M 886 115 h 10 v 128 h -10" stroke="currentColor" fill="none" stroke-width="2" /><text x="770" y="150" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">19</text><circle cx="846" cy="142" r="27" stroke="var(--pcd-accent)" fill="none" stroke-width="4" /><text x="834" y="150" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">22</text><text x="770" y="214" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">43</text><text x="834" y="214" font-size="30" fill="currentColor" font-family="system-ui, sans-serif">50</text><text x="220" y="390" font-size="34" fill="currentColor" font-family="system-ui, sans-serif">1 × 6 + 2 × 8 → 22</text></g></svg>