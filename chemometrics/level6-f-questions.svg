<title id="t">Two questions using an F reference</title><desc id="d">Left: narrow and wide schematic repeat-measurement bands around the same centre illustrate precision comparison. Right: a flat and a sloped calibration line illustrate comparing two models fitted to one dataset. These are conceptual drawings, not observations or fitted experimental results.</desc>
<rect x="2" y="2" width="1096" height="246" rx="14" fill="#f4f8fc" stroke="#56809c"/>
<path d="M550 25V225" stroke="#a0b8c8"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147"><g font-size="22" font-weight="bold"><text x="32" y="40">TWO MEASUREMENT METHODS</text><text x="590" y="40">TWO FITS TO ONE DATASET</text></g>
<text x="35" y="96" font-size="20">Method A</text><text x="35" y="157" font-size="20">Method B</text><text x="65" y="218" font-size="18">Compare estimated variances</text>
<text x="870" y="94" font-size="18" fill="#7545a0">Add a slope</text><text x="870" y="160" font-size="18" fill="#246e96">Flat model</text><text x="600" y="218" font-size="18">Compare explained and remaining scatter</text></g>
