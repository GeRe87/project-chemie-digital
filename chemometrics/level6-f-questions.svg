<path d="M610 185V62M610 185H1040" fill="none" stroke="#20485e" stroke-width="2"/><path d="M630 150H1030" stroke="#246e96" stroke-width="4"/><path d="M630 174L1030 68" stroke="#7545a0" stroke-width="4"/>
