<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Sampling distributions describe calculated statistics</title><desc id="desc">Independent normal laboratory results lead to three references: squared residual coordinates give chi-square for variance, a normal mean divided by an independent estimated scale gives Student-t for mean inference, and two independent variance scales give F for comparing precision. These are not distributions of raw measurements.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}}</style>
<rect class="bg" width="1200" height="440" rx="18"/>
<text class="ink" x="600" y="43" font-size="31" text-anchor="middle">Independent normal analytical results</text>
<path class="line" d="M600 60V87H210V115M600 87V115M600 87H990V115"/>
<g class="box"><rect x="30" y="115" width="360" height="235" rx="15"/><rect x="420" y="115" width="360" height="235" rx="15"/><rect x="810" y="115" width="360" height="235" rx="15"/></g>
<g class="ink" font-size="27" text-anchor="middle"><text x="210" y="162">Squared residual coordinates</text><text x="210" y="210">→ Chi-square</text><text x="210" y="275">Uncertainty in</text><text x="210" y="312">repeatability variance</text><text x="600" y="162">Mean / estimated scale</text><text x="600" y="210">→ Student-t</text><text x="600" y="275">A mean interval</text><text x="600" y="312">when SD is unknown</text><text x="990" y="162">Two variance scales</text><text x="990" y="210">→ F</text><text x="990" y="275">Compare precision</text><text x="990" y="312">of independent series</text><text x="600" y="410">Exact references require the stated normality and independence assumptions.</text></g>
</svg>
