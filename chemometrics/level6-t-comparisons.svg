<title id="title">A t-test can compare a mean with a fixed reference or compare two independent means</title><desc id="desc">Left: repeated measurements of a QC sample against a fixed target. Right: independent river-water samples collected before and after an industrial park. The image distinguishes the comparison structures, not actual measured distributions.</desc>
