<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="t d"><title id="t">Paired samples from an oxidation batch</title><desc id="d">One stirred oxidation reactor is sampled before treatment and at the end. The two bottles share a batch identity. Repeat in six independent batches; each batch contributes one before-minus-after pollutant concentration difference.</desc><rect x="2" y="2" width="656" height="436" rx="14" fill="#f4f8fc" stroke="#56809c"/><path d="M230 100V292Q330 340 430 292V100Z" fill="#a9d9e9" stroke="#20485e" stroke-width="4"/><ellipse cx="330" cy="100" rx="100" ry="24" fill="#e0edf6" stroke="#20485e" stroke-width="4"/><path d="M330 63V265M280 250H380" stroke="#7545a0" stroke-width="9"/><path d="M100 180V260H160V180ZM500 180V260H560V180Z" fill="#fff" stroke="#20485e" stroke-width="3"/><path d="M230 185H160M430 235H500" stroke="#56809c" stroke-width="4"/><g fill="#153147" font-family="Arial,Helvetica,sans-serif" text-anchor="middle" font-size="22"><text x="330" y="39" font-weight="bold">BATCH OXIDATION</text><text x="110" y="140">Before</text><text x="540" y="140">End</text><text x="330" y="352">Same batch: linked concentrations</text><text x="330" y="390" font-size="19">Six independent batches → six differences</text></g></svg>
