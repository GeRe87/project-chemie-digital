<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 530" role="img" aria-labelledby="title desc">
<title id="title">Same normal Q-Q reference, compatible and skewed examples</title><desc id="desc">Both panels compare sorted concentrations with theoretical quantiles from fixed normal mean 10 and SD 0.50 mg/L, at probabilities 0.1, 0.3, 0.5, 0.7, 0.9. A is near the identity line. B has four near-equal values near 10.3 and an upper value 12, giving a sharp bend. Both axes have identical units and limits in both panels.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.axis{fill:none;stroke:#294f60;stroke-width:3}.ref{fill:none;stroke:#a25920;stroke-width:3;stroke-dasharray:7 5}.dot{fill:#007c91;stroke:#f3f8fa;stroke-width:2}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.axis{stroke:#c0dbe5}.ref{stroke:#ffc083}.dot{fill:#7bd9e3;stroke:#152f3a}}</style>
<rect class="bg" width="760" height="530" rx="18"/>
<g class="ink" text-anchor="middle" font-size="27"><text x="205" y="38">A: near the line</text><text x="585" y="38">B: a pronounced bend</text></g>
<g id="qq-a"><path class="axis" d="M65 95V385H345"/><path class="ref" d="M65 385L345 105"/>
<g class="dot"><circle cx="96.432" cy="350" r="6" data-x="9.3592242172277" data-y="9.4"/><circle cx="129.557" cy="315" r="6" data-x="9.73779974364598" data-y="9.8"/><circle cx="152.5" cy="297.5" r="6" data-x="10" data-y="10"/><circle cx="175.443" cy="280" r="6" data-x="10.26220025635402" data-y="10.2"/><circle cx="208.568" cy="245" r="6" data-x="10.6407757827723" data-y="10.6"/></g></g>
<g id="qq-b" transform="translate(380 0)"><path class="axis" d="M65 95V385H345"/><path class="ref" d="M65 385L345 105"/>
<g class="dot"><circle cx="96.432" cy="271.25" r="6" data-x="9.3592242172277" data-y="10.3"/><circle cx="129.557" cy="270.375" r="6" data-x="9.73779974364598" data-y="10.31"/><circle cx="152.5" cy="269.5" r="6" data-x="10" data-y="10.32"/><circle cx="175.443" cy="268.625" r="6" data-x="10.26220025635402" data-y="10.33"/><circle cx="208.568" cy="122.5" r="6" data-x="10.6407757827723" data-y="12"/></g></g>
<g class="ink" font-size="22" text-anchor="middle"><text x="65" y="415">9</text><text x="152.5" y="415">10</text><text x="240" y="415">11</text><text x="327.5" y="415">12</text><text x="445" y="415">9</text><text x="532.5" y="415">10</text><text x="620" y="415">11</text><text x="707.5" y="415">12</text><text x="205" y="451">Theoretical quantile (mg/L)</text><text x="585" y="451">Theoretical quantile (mg/L)</text><text transform="translate(20 245) rotate(-90)">Sorted result (mg/L)</text><text transform="translate(400 245) rotate(-90)">Sorted result (mg/L)</text><text x="45" y="390">9</text><text x="45" y="303">10</text><text x="45" y="215">11</text><text x="45" y="128">12</text><text x="425" y="390">9</text><text x="425" y="303">10</text><text x="425" y="215">11</text><text x="425" y="128">12</text><text x="380" y="485">Dashed: identity line for the fixed normal model</text><text x="380" y="515">Dots: constructed analytical results</text></g>
