<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" font-family="system-ui, sans-serif">
  <title>Allow for both method and operator</title>
  <desc>In the additive model with both factors, testing method after accounting for operator gives p approximately 0.000633 and partial eta squared 67.8 percent. Testing operator after accounting for method gives p approximately 0.974 and partial eta squared 0.4 percent. Adding operator to a method-only model reduces residual SS from 30.00 to 29.88.</desc>
  <text x="55" y="45" text-anchor="start" font-size="27" font-weight="700" fill="#163349">Fit method and operator in the same model</text>
  <text x="55" y="86" text-anchor="start" font-size="21" font-weight="400" fill="#163349">Ask what each factor adds after accounting for the other.</text>
  <rect x="56" y="112" width="888" height="57" fill="#10698a" fill-opacity=".11"/>
  <text x="71" y="149" text-anchor="start" font-size="21" font-weight="700" fill="#163349">Term added last</text>
  <text x="608" y="149" text-anchor="middle" font-size="21" font-weight="700" fill="#163349">p-value</text>
  <text x="818" y="149" text-anchor="middle" font-size="21" font-weight="700" fill="#163349">Partial η²</text>
  <text x="71" y="210" text-anchor="start" font-size="22" font-weight="650" fill="#10698a">Method, accounting for operator</text>
  <text x="608" y="210" text-anchor="middle" font-size="22" font-weight="650" fill="#163349">0.000633</text>
  <text x="818" y="210" text-anchor="middle" font-size="22" font-weight="700" fill="#10698a">67.8%</text>
  <path d="M56 228H944" fill="none" stroke="#d4dfe6" stroke-width="2"/>
  <text x="71" y="265" text-anchor="start" font-size="22" font-weight="650" fill="#5c3a98">Operator, accounting for method</text>
  <text x="608" y="265" text-anchor="middle" font-size="22" font-weight="650" fill="#163349">0.974</text>
  <text x="818" y="265" text-anchor="middle" font-size="22" font-weight="700" fill="#5c3a98">0.4%</text>
  <text x="56" y="323" text-anchor="start" font-size="21" font-weight="650" fill="#163349">After fitting method, adding operator changes residual SS from 30.00 to 29.88.</text>
  <text x="56" y="346" font-size="17" fill="#163349">Partial η² uses the variation added by the factor plus the remaining residual.</text>
  <text x="56" y="377" text-anchor="start" font-size="21" font-weight="700" fill="#10698a">In this example, investigate method choice first.</text>
</svg>
