<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="title desc">
<title id="title">Six scaled residuals, squared and added</title><desc id="desc">In measurement order, scaled residuals are minus one, one, minus two, two, minus one, one. Their squares are one, one, four, four, one, one. Squared sum twelve. Scaling uses fitted mean ten and fixed reference SD 0.10 mg/L. The six residuals are constrained by the fitted mean and are not independent standard normals.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.sum{fill:#f2dfc6;stroke:#a25920;stroke-width:3}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.sum{fill:#59412e;stroke:#ffc083}}</style>
<rect class="bg" width="760" height="430" rx="18"/>
<g class="ink" text-anchor="middle" font-size="26"><text x="380" y="36">Subtract mean 10.05, divide by reference SD 0.10</text><text x="380" y="75">All scaled residuals below are dimensionless.</text></g>
<g class="box"><rect x="20" y="115" width="105" height="140" rx="12"/><rect x="143" y="115" width="105" height="140" rx="12"/><rect x="266" y="115" width="105" height="140" rx="12"/><rect x="389" y="115" width="105" height="140" rx="12"/><rect x="512" y="115" width="105" height="140" rx="12"/><rect x="635" y="115" width="105" height="140" rx="12"/></g>
<g class="ink" font-size="31" text-anchor="middle"><text x="72" y="160">−1</text><text x="195" y="160">+1</text><text x="318" y="160">−2</text><text x="441" y="160">+2</text><text x="564" y="160">−1</text><text x="687" y="160">+1</text><text x="72" y="230">1</text><text x="195" y="230">1</text><text x="318" y="230">4</text><text x="441" y="230">4</text><text x="564" y="230">1</text><text x="687" y="230">1</text></g>
<g class="ink" font-size="22" text-anchor="middle"><text x="72" y="193">square ↓</text><text x="195" y="193">square ↓</text><text x="318" y="193">square ↓</text><text x="441" y="193">square ↓</text><text x="564" y="193">square ↓</text><text x="687" y="193">square ↓</text></g>
<rect class="sum" x="210" y="285" width="340" height="65" rx="12"/>
<g class="ink" font-size="29" text-anchor="middle"><text x="380" y="328">Sum of squares: 12</text><text x="380" y="395">Six terms, but only five residual directions.</text></g>
</svg>
