<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Fitting one mean leaves five independent normal residual directions</title><desc id="desc">Six independent normal readings, one fitted mean, one zero-sum constraint. Orthogonal transformation leaves five independent normal residual coordinates. At true SD equal to the reference, the scaled squared-deviation sum is the squared sum of five independent standard-normal coordinates and has chi-square with five df. The raw residuals are not independent.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}}</style>
<rect class="bg" width="760" height="460" rx="18"/>
<g class="box"><rect x="30" y="50" width="300" height="120" rx="14"/><rect x="430" y="50" width="300" height="120" rx="14"/><rect x="30" y="245" width="300" height="140" rx="14"/><rect x="430" y="245" width="300" height="140" rx="14"/></g>
<g class="ink" font-size="26" text-anchor="middle"><text x="180" y="100">Six independent</text><text x="180" y="140">normal results</text><text x="580" y="100">Fit one mean</text><text x="580" y="140">One residual constraint</text><text x="180" y="285">Five independent normal</text><text x="180" y="325">residual coordinates</text><text x="180" y="365">Orthogonal transform</text><text x="580" y="285">Square and add</text><text x="580" y="325">Chi-square with 5 df</text><text x="580" y="365">At true SD = reference</text><text x="380" y="440">Raw centered residuals are not independent standard normals.</text></g>
<path class="line" d="M335 110H420M580 175V205H180V235M335 315H420"/>
</svg>
