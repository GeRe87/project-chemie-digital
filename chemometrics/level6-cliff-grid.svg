<svg xmlns="http://www.w3.org/2000/svg" width="660" height="440" viewBox="0 0 660 440" role="img" aria-labelledby="title desc">
<title id="title">Nine oriented X versus Y pair comparisons</title><desc id="desc">X values 1, 2, 2 form rows and Y values 2, 3, 4 form columns. Seven cells are labelled loss and two tie. There are zero X wins. Repeated values remain separate observations; the nine comparisons reuse six observations.</desc>
<rect x="2" y="2" width="656" height="436" rx="14" fill="#f5f8fc" stroke="#176da0" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle" font-size="23"><text x="330" y="39" font-size="25" font-weight="bold">X minus Y: wins, losses and ties</text><text x="104" y="98">X ↓ / Y →</text><text x="270" y="98">Y = 2</text><text x="412" y="98">Y = 3</text><text x="554" y="98">Y = 4</text></g>
<g stroke="#a85b13" fill="#fff0dc" stroke-width="2"><rect x="204" y="122" width="132" height="68"/><rect x="346" y="122" width="132" height="68"/><rect x="488" y="122" width="132" height="68"/><rect x="346" y="200" width="132" height="68"/><rect x="488" y="200" width="132" height="68"/><rect x="346" y="278" width="132" height="68"/><rect x="488" y="278" width="132" height="68"/></g>
<g stroke="#176da0" fill="#e4f2fc" stroke-width="2"><rect x="204" y="200" width="132" height="68"/><rect x="204" y="278" width="132" height="68"/></g>
<g font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#153147" text-anchor="middle"><text x="104" y="165">X₁ = 1</text><text x="104" y="243">X₂ = 2</text><text x="104" y="321">X₃ = 2</text><text x="270" y="165">LOSS</text><text x="412" y="165">LOSS</text><text x="554" y="165">LOSS</text><text x="270" y="243">TIE</text><text x="412" y="243">LOSS</text><text x="554" y="243">LOSS</text><text x="270" y="321">TIE</text><text x="412" y="321">LOSS</text><text x="554" y="321">LOSS</text><text x="330" y="397" font-size="22">0 wins · 7 losses · 2 ties · 9 comparisons</text></g>
</svg>
