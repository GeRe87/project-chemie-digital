<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle" font-size="23" font-weight="bold"><text x="142" y="482">TRUE POSITIVE</text><text x="412" y="482">FALSE POSITIVE</text><text x="686" y="482">FALSE NEGATIVE</text><text x="956" y="482">TRUE NEGATIVE</text><g font-size="21" font-weight="normal"><text x="142" y="521">Correct alarm</text><text x="412" y="521">Type I error (α)</text><text x="686" y="521">Type II error (β)</text><text x="956" y="521">Correct silence</text></g><text x="550" y="598" font-size="21" font-weight="normal">μ: population mean · L: reference · ≤: at or below · &gt;: above</text><text x="550" y="630" font-size="20" font-weight="normal">H₀: null claim · H₁: alternative · α: type I limit · β: type II probability at a specified alternative</text></g></svg>
