<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="650" viewBox="0 0 1100 650" role="img" aria-labelledby="t d"><title id="t">One decision tree, four possible outcomes</title><desc id="d">H0 says population mean at or below reference. Reject H0 is positive, claiming an exceedance; do not reject is negative. Each decision branches on population reality. Positive with real exceedance is true positive; positive with true H0 is false positive, type I. Negative with real exceedance is false negative, type II; negative with true H0 is true negative. Bottle and bell thumbnails label alarms and silence.</desc>
<rect x="2" y="2" width="1096" height="646" rx="16" fill="#f4f8fc" stroke="#56809c"/>
<rect x="300" y="22" width="500" height="82" rx="12" fill="#e0edf6" stroke="#277ba2" stroke-width="2"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle"><text x="550" y="55" font-size="26" font-weight="bold">H₀: μ ≤ L   ·   H₁: μ &gt; L</text><text x="550" y="86" font-size="22">Test the population mean against a reference</text></g>
<path d="M550 104V128H278V160M550 128H822V160M278 254V289H142V328M278 289H412V328M822 254V289H686V328M822 289H956V328" fill="none" stroke="#56809c" stroke-width="3"/>
