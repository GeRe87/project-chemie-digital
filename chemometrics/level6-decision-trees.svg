<g fill="#f4f8fc"><rect x="60" y="294" width="164" height="29"/><rect x="330" y="294" width="164" height="29"/><rect x="604" y="294" width="164" height="29"/><rect x="874" y="294" width="164" height="29"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" text-anchor="middle" font-size="24"><text x="278" y="198" font-weight="bold">POSITIVE: REJECT H₀</text><text x="278" y="231">Claim an exceedance</text><text x="822" y="198" font-weight="bold">NEGATIVE: DO NOT REJECT H₀</text><text x="822" y="231">Evidence is insufficient</text><g font-size="20"><text x="142" y="317">μ &gt; L is true</text><text x="412" y="317">H₀ is true</text><text x="686" y="317">μ &gt; L is true</text><text x="956" y="317">H₀ is true</text></g></g>
