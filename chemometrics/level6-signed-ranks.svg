<svg xmlns="http://www.w3.org/2000/svg" width="760" height="440" viewBox="0 0 760 440" role="img" aria-labelledby="t d">
<title id="t">Original paired differences become signed ranks</title><desc id="d">Differences 1, minus 2, 3, 4, 5 micrograms per litre have ranks of absolute difference 1, 2, 3, 4, 5. Restore the original signs: positive ranks sum 13 and negative ranks sum 2. Keep original pair identities.</desc>
<rect x="2" y="2" width="756" height="436" rx="14" fill="#f4f8fc" stroke="#56809c"/><rect x="386" y="78" width="65" height="240" rx="10" fill="#ffe7d7"/>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="24"><text x="380" y="43" text-anchor="middle" font-weight="bold">PAIR → DIFFERENCE → RANK OF abs(diff)</text><text x="25" y="130">Difference</text><text x="25" y="210">Rank of abs(diff)</text><text x="25" y="290">Signed rank</text>
<g text-anchor="middle"><text x="335" y="130">1</text><text x="420" y="130">−2</text><text x="505" y="130">3</text><text x="590" y="130">4</text><text x="675" y="130">5</text><text x="335" y="210">1</text><text x="420" y="210">2</text><text x="505" y="210">3</text><text x="590" y="210">4</text><text x="675" y="210">5</text><text x="335" y="290">+1</text><text x="420" y="290">−2</text><text x="505" y="290">+3</text><text x="590" y="290">+4</text><text x="675" y="290">+5</text><text x="380" y="365">Positive sum 13 · negative sum 2</text><text x="380" y="409" font-size="21">Five original pairs · differences in µg/L · abs: absolute value</text></g></g></svg>
