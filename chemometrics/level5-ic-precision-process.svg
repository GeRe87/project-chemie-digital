<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 460" role="img" aria-labelledby="title desc">
<title id="title">A practical IC repeatability check creates the need for chi-square</title><desc id="desc">Prior validation supplies reference SD 0.10 mg/L. Six independent nitrate measurements of one homogeneous water sample give today's variance estimate. Ask whether the larger observed spread is beyond expected chance variation under unchanged precision. This tests precision, not trueness or the cause of a possible problem.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}}</style>
<rect class="bg" width="1200" height="460" rx="18"/>
<g class="box"><rect x="25" y="70" width="330" height="260" rx="14"/><rect x="435" y="70" width="330" height="260" rx="14"/><rect x="845" y="70" width="330" height="260" rx="14"/></g>
<g class="ink" text-anchor="middle" font-size="28"><text x="190" y="40">Validated IC method</text><text x="600" y="40">Today's repeatability check</text><text x="1010" y="40">Analytical question</text><text x="190" y="120">Nitrate in water</text><text x="190" y="245">Reference SD: 0.10 mg/L</text><text x="190" y="292">Treated as known here</text><text x="600" y="120">One homogeneous sample</text><text x="600" y="245">Six independent results</text><text x="600" y="292">Estimate today's spread</text><text x="1010" y="130">Has precision worsened?</text><text x="1010" y="205">Or could larger spread</text><text x="1010" y="245">occur by chance?</text><text x="1010" y="292">Use a sampling reference</text><text x="395" y="210">→</text><text x="805" y="210">→</text><text x="600" y="395">A column problem is suspected, not established by the test.</text><text x="600" y="440">We test repeatability, not whether the nitrate mean is correct.</text></g>
<path class="line" d="M110 155h160v48H110zM130 185l20-12 20 13 20-20 20 13 20-6 20 12M540 150h120M550 150v62h100v-62M560 193h80"/>
