<circle cx="902" cy="160" r="5" fill="#10698a"/>
<path d="M742 232L902 232" fill="none" stroke="#5c3a98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M742 218v28m-5 0h10m-10 -28h10" fill="none" stroke="#5c3a98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="742" cy="232" r="5" fill="#5c3a98"/>
<path d="M902 218v28m-5 0h10m-10 -28h10" fill="none" stroke="#5c3a98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="902" cy="232" r="5" fill="#5c3a98"/>
<path d="M755 110h8V232h-8" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M915 160h8V232h-8" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="742" y="297" text-anchor="middle" font-size="18" font-weight="400" fill="#163349">Reference</text>
<text x="902" y="297" text-anchor="middle" font-size="18" font-weight="400" fill="#163349">Other condition</text>
<text x="822" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#a14518">The gap narrows.</text>
<text x="500" y="385" text-anchor="middle" font-size="19" font-weight="400" fill="#163349">Points show means. Bars show illustrative 95% confidence intervals.</text>
</svg>
