<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" font-family="system-ui, sans-serif">
<title>When one factor changes the effect of another</title>
<desc>Three schematic plots show widening gaps, nearly constant gaps, and narrowing gaps. Illustrative confidence intervals show uncertainty around each mean. The interaction test assesses whether the gaps change across conditions.</desc>
<text x="76" y="79" text-anchor="middle" font-size="17" font-weight="400" fill="#163349">Mean response</text>
<text x="178" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#10698a">Synergy</text>
<path d="M38 91V270H316" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M98 160L258 110" fill="none" stroke="#10698a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M98 146v28m-5 0h10m-10 -28h10" fill="none" stroke="#10698a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="98" cy="160" r="5" fill="#10698a"/>
<path d="M258 96v28m-5 0h10m-10 -28h10" fill="none" stroke="#10698a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="258" cy="110" r="5" fill="#10698a"/>
<path d="M98 232L258 232" fill="none" stroke="#5c3a98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M98 218v28m-5 0h10m-10 -28h10" fill="none" stroke="#5c3a98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="98" cy="232" r="5" fill="#5c3a98"/>
<path d="M258 218v28m-5 0h10m-10 -28h10" fill="none" stroke="#5c3a98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="258" cy="232" r="5" fill="#5c3a98"/>
<path d="M111 160h8V232h-8" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M271 110h8V232h-8" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="98" y="297" text-anchor="middle" font-size="18" font-weight="400" fill="#163349">Reference</text>
<text x="258" y="297" text-anchor="middle" font-size="18" font-weight="400" fill="#163349">Other condition</text>
<text x="178" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#10698a">The gap widens.</text>
<text x="500" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#163349">No interaction</text>
<path d="M360 91V270H638" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M420 147L580 144" fill="none" stroke="#10698a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M420 133v28m-5 0h10m-10 -28h10" fill="none" stroke="#10698a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="420" cy="147" r="5" fill="#10698a"/>
<path d="M580 130v28m-5 0h10m-10 -28h10" fill="none" stroke="#10698a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="580" cy="144" r="5" fill="#10698a"/>
<path d="M420 227L580 222" fill="none" stroke="#5c3a98" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M420 213v28m-5 0h10m-10 -28h10" fill="none" stroke="#5c3a98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
