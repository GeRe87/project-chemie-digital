<path d="M580 208v28m-5 0h10m-10 -28h10" fill="none" stroke="#5c3a98" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<circle cx="580" cy="222" r="5" fill="#5c3a98"/>
<path d="M433 147h8V227h-8" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<path d="M593 144h8V222h-8" fill="none" stroke="#788d9a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
<text x="420" y="297" text-anchor="middle" font-size="18" font-weight="400" fill="#163349">Reference</text>
<text x="580" y="297" text-anchor="middle" font-size="18" font-weight="400" fill="#163349">Other condition</text>
<text x="500" y="332" text-anchor="middle" font-size="20" font-weight="700" fill="#163349">The gap stays about the same.</text>
<text x="822" y="44" text-anchor="middle" font-size="26" font-weight="700" fill="#a14518">Antagonism</text>
