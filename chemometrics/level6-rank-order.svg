<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="225" viewBox="0 0 1100 225" role="img" aria-labelledby="t d">
<title id="t">Compare the order of the X and Y responses</title><desc id="d">On a common response scale in arbitrary units, X has values 1,2,2 and Y has 2,3,4. The two X observations of 2 are stacked to preserve both. A callout compares X equal to 2 with Y equal to 3: X is lower, so this comparison contributes zero to U for X.</desc>
<rect x="2" y="2" width="1096" height="221" rx="14" fill="#f4f8fc" stroke="#56809c"/>
<path d="M160 165H670M220 158V173M350 158V173M480 158V173M610 158V173" stroke="#20485e" stroke-width="2"/>
<g fill="#277ba2" stroke="#153147" stroke-width="2"><circle cx="220" cy="69" r="10"/><circle cx="350" cy="53" r="10"/><circle cx="350" cy="84" r="10"/></g><g fill="#8754ae" stroke="#153147" stroke-width="2"><circle cx="350" cy="128" r="10"/><circle cx="480" cy="128" r="10"/><circle cx="610" cy="128" r="10"/></g>
<g font-family="Arial,Helvetica,sans-serif" fill="#153147" font-size="22"><text x="30" y="76">Group X</text><text x="30" y="136">Group Y</text><text x="214" y="198">1</text><text x="344" y="198">2</text><text x="474" y="198">3</text><text x="604" y="198">4</text><text x="724" y="62" font-weight="bold">ONE COMPARISON</text><text x="724" y="102">X: 2 a.u. · Y: 3 a.u.</text><text x="724" y="143">X is lower → zero points for X</text><text x="724" y="189" font-size="18">Repeated values stay separate.</text><text x="365" y="28" text-anchor="middle" font-size="18">Synthetic responses (a.u.)</text></g></svg>
