<text x="510" y="380" font-size="21" font-weight="400" fill="#163349" text-anchor="middle">Mean 65%</text>
<circle cx="755" cy="179" r="8" fill="#a14518"/>
<circle cx="772" cy="151" r="8" fill="#a14518"/>
