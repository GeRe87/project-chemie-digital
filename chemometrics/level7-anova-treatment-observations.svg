<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 410" font-family="system-ui, sans-serif">
<title>Does the water treatment technique matter?</title>
<desc>In the illustrative NOM condition the measured removals are activated carbon 51, 55, 54, 56%; ultrafiltration 62, 66, 65, 67%; ion exchange 69, 73, 71, 75%.</desc>
<text x="56" y="39" font-size="29" font-weight="700" fill="#163349" text-anchor="start">One water condition: NOM addition</text>
<text x="56" y="71" font-size="20" font-weight="400" fill="#163349" text-anchor="start">Contaminant removal (%) · four independent runs per technique</text>
<path d="M85 312L935 312" fill="none" stroke="#788d9a" stroke-width="1"/>
<text x="73" y="318" font-size="18" font-weight="400" fill="#163349" text-anchor="end">50</text>
