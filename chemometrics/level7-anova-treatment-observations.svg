<text x="73" y="283" font-size="18" font-weight="400" fill="#163349" text-anchor="end">55</text>
<path d="M85 242L935 242" fill="none" stroke="#788d9a" stroke-width="1"/>
<text x="73" y="248" font-size="18" font-weight="400" fill="#163349" text-anchor="end">60</text>
<path d="M85 207L935 207" fill="none" stroke="#788d9a" stroke-width="1"/>
<text x="73" y="213" font-size="18" font-weight="400" fill="#163349" text-anchor="end">65</text>
<path d="M85 172L935 172" fill="none" stroke="#788d9a" stroke-width="1"/>
<text x="73" y="178" font-size="18" font-weight="400" fill="#163349" text-anchor="end">70</text>
<path d="M85 137L935 137" fill="none" stroke="#788d9a" stroke-width="1"/>
<text x="73" y="143" font-size="18" font-weight="400" fill="#163349" text-anchor="end">75</text>
<path d="M85 102L935 102" fill="none" stroke="#788d9a" stroke-width="1"/>
<text x="73" y="108" font-size="18" font-weight="400" fill="#163349" text-anchor="end">80</text>
<circle cx="215" cy="305" r="8" fill="#10698a"/>
<circle cx="232" cy="277" r="8" fill="#10698a"/>
<circle cx="249" cy="284" r="8" fill="#10698a"/>
<circle cx="266" cy="270" r="8" fill="#10698a"/>
