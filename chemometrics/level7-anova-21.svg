<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 450" font-family="system-ui, sans-serif">
  <title>Diagnose the residuals</title>
  <desc>A residual is observed recovery minus the fitted method mean. The table lists all 18 river-water preparations with observed recovery, fitted recovery, and residual. The normal Q-Q plot of these residuals compares the ordered decimal residuals with a normal reference line. In the schematic heavy-tail example, both ends depart strongly: the left tail falls far below the line and the right tail rises far above it. The descriptive KS distances to separate fitted normal distributions are 0.110 for the river-water residuals and 0.248 for the heavy-tail example. The Monte Carlo p-values are approximately 0.812 and 0.040, respectively, with model fitting repeated on each simulated sample.</desc>
  <g data-svg-stage="0" transform="translate(0 140) scale(.25)">
    <g fill="#163349">
      <text x="48" y="55" font-size="25" font-weight="700">One preparation from Method A</text>
      <path d="M150 320V104" fill="none" stroke="#788d9a" stroke-width="2"/>
      <path d="M150 155H478 M150 279H478" fill="none" stroke="#d4dfe6" stroke-width="2"/>
      <text x="132" y="163" text-anchor="end" font-size="24">95.92%</text>
      <text x="132" y="287" text-anchor="end" font-size="24">94.00%</text>
      <circle cx="292" cy="155" r="9" fill="#10698a"/>
      <text x="310" y="138" font-size="21">Observed recovery</text>
      <path d="M274 279H310" fill="none" stroke="#5c3a98" stroke-width="5"/>
      <text x="310" y="311" font-size="21">Fitted method mean</text>
      <path d="M465 162V272 m-7-103 7-7 7 7 m-14 96 7 7 7-7" fill="none" stroke="#a14518" stroke-width="3"/>
      <text x="485" y="224" font-size="23" fill="#a14518" font-weight="700">+1.92</text>
    </g>
    <g fill="#163349">
      <text x="590" y="66" font-size="25" font-weight="700">What is a residual?</text>
      <text x="590" y="112" font-size="21">Observed recovery minus</text>
      <text x="590" y="147" font-size="21">the fitted method mean.</text>
      <text x="590" y="182" font-size="21">95.92% minus 94.00% gives</text>
      <text x="590" y="217" font-size="21">+1.92 percentage points.</text>
      <text x="590" y="252" font-size="21">Positive means above the fit.</text>
    </g>
  </g>
