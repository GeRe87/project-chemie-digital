        <text y="128"><tspan x="34">13</tspan><tspan x="104">94.14</tspan><tspan x="174">93.00</tspan><tspan x="251" fill="#5c3a98" font-weight="700">+1.14</tspan></text>
        <text y="164"><tspan x="34">14</tspan><tspan x="104">92.87</tspan><tspan x="174">93.00</tspan><tspan x="251" fill="#5c3a98" font-weight="700">−0.13</tspan></text>
        <text y="200"><tspan x="34">15</tspan><tspan x="104">92.09</tspan><tspan x="174">93.00</tspan><tspan x="251" fill="#5c3a98" font-weight="700">−0.91</tspan></text>
        <text y="236"><tspan x="34">16</tspan><tspan x="104">94.99</tspan><tspan x="174">93.00</tspan><tspan x="251" fill="#5c3a98" font-weight="700">+1.99</tspan></text>
        <text y="272"><tspan x="34">17</tspan><tspan x="104">91.03</tspan><tspan x="174">93.00</tspan><tspan x="251" fill="#5c3a98" font-weight="700">−1.97</tspan></text>
        <text y="308"><tspan x="34">18</tspan><tspan x="104">92.88</tspan><tspan x="174">93.00</tspan><tspan x="251" fill="#5c3a98" font-weight="700">−0.12</tspan></text>
      </g>
    </g>
    <text x="15" y="367" font-size="20">Observed and fitted recovery in %. Residuals in percentage points.</text>
  </g>
