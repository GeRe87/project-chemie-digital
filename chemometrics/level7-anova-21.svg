  <!-- Monte Carlo calibration: Python Random(721), 99999 draws per model; exceedances 81206 and 4018. Schematic sample: [-10, -4, -1, -0.8, -0.6, -0.3, 0.3, 0.6, 0.8, 1, 4, 10]. -->
  <g data-svg-stage="3" transform="translate(697.5 140) scale(.25)" fill="#163349">
    <text x="40" y="65" font-size="28" font-weight="700">Kolmogorov–Smirnov distance</text>
    <text x="40" y="105" font-size="21">CDF: the proportion of observations at or below a value.</text>
    <text x="40" y="134" font-size="21">D is the largest gap from the fitted normal model.</text>
    <rect x="40" y="143" width="405" height="171" rx="12" fill="#10698a" fill-opacity=".12"/>
    <rect x="480" y="143" width="405" height="171" rx="12" fill="#a14518" fill-opacity=".12"/>
