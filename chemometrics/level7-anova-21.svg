        <text y="272"><tspan x="34">5</tspan><tspan x="104">95.92</tspan><tspan x="174">94.00</tspan><tspan x="251" fill="#10698a" font-weight="700">+1.92</tspan></text>
        <text y="308"><tspan x="34">6</tspan><tspan x="104">93.85</tspan><tspan x="174">94.00</tspan><tspan x="251" fill="#10698a" font-weight="700">−0.15</tspan></text>
