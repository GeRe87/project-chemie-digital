        <text y="164"><tspan x="34">2</tspan><tspan x="104">95.33</tspan><tspan x="174">94.00</tspan><tspan x="251" fill="#10698a" font-weight="700">+1.33</tspan></text>
        <text y="200"><tspan x="34">3</tspan><tspan x="104">93.81</tspan><tspan x="174">94.00</tspan><tspan x="251" fill="#10698a" font-weight="700">−0.19</tspan></text>
