<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
<title id="title">Relative growth motivates a lognormal size model</title><desc id="desc">Relative effects multiply particle diameters. Natural logarithms of dimensionless diameter ratios turn products into sums. An approximately normal sum of suitable log effects motivates a lognormal diameter model, not proof from three stages.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}.particle{fill:#68b9cb;stroke:#126c82;stroke-width:3}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}.particle{fill:#42889c;stroke:#7bd9e3}}</style>
<rect class="bg" width="1200" height="440" rx="18"/>
<g class="box"><rect x="25" y="35" width="245" height="215" rx="14"/><rect x="335" y="35" width="245" height="215" rx="14"/><rect x="645" y="35" width="245" height="215" rx="14"/></g>
<g class="particle"><circle cx="148" cy="137" r="23"/><circle cx="458" cy="137" r="34"/><circle cx="768" cy="137" r="48"/></g>
<g class="ink" text-anchor="middle" font-size="28"><text x="148" y="77">Initial size</text><text x="458" y="77">Relative growth</text><text x="768" y="77">Further growth</text><text x="148" y="220">Positive diameter</text><text x="458" y="220">Multiply by a factor</text><text x="768" y="220">Multiply again</text><text x="302" y="148">→</text><text x="612" y="148">→</text><text x="925" y="148">→</text><text x="1063" y="77">Candidate</text><text x="1063" y="111">lognormal</text><text x="600" y="304">Diameter scale: relative effects multiply.</text><text x="600" y="348">Log-ratio scale: log effects add.</text><text x="600" y="401">A normal log-size model needs suitable contributions and model checks.</text></g>
<path class="line" d="M960 210H1175M968 208C984 205 985 135 1009 133S1050 203 1168 208"/>
</svg>
