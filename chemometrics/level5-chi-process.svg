<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc">
<title id="title">Repeatability study to chi-square variance reference</title><desc id="desc">One control material is measured in independent groups of five. Each group fits its mean and sums squared deviations to estimate repeatability variance. New groups give different variance estimates. Under normal sampling, scaling variance by its true value gives chi-square with four residual degrees of freedom.</desc>
<style>.bg{fill:#f3f8fa}.ink{fill:#143d4b;font-family:Arial,sans-serif}.box{fill:#dfedf2;stroke:#538294;stroke-width:3}.line{fill:none;stroke:#126c82;stroke-width:4}.dot{fill:#126c82}@media(prefers-color-scheme:dark){.bg{fill:#152f3a}.ink{fill:#f0f7fa}.box{fill:#294d59;stroke:#98c7d8}.line{stroke:#7bd9e3}.dot{fill:#7bd9e3}}</style>
<rect class="bg" width="1200" height="470" rx="18"/><g class="box"><rect x="30" y="65" width="330" height="280" rx="14"/><rect x="435" y="65" width="330" height="280" rx="14"/><rect x="840" y="65" width="330" height="280" rx="14"/></g>
<g class="ink" text-anchor="middle" font-size="27"><text x="195" y="40">One unchanged control</text><text x="600" y="40">Each five-result series</text><text x="1005" y="40">Across new series</text><text x="195" y="110">Independent normal results</text><text x="195" y="280">9.6, 9.8, 10.0, 10.2, 10.4</text><text x="195" y="320">Concentration (mg/L)</text><text x="600" y="110">Fit mean, square deviations</text><text x="600" y="280">Squared deviations: 0.40</text><text x="600" y="320">Variance: 0.10 (mg/L)²</text><text x="1005" y="110">Variance estimates vary</text><text x="1005" y="280">Scale by true variance</text><text x="1005" y="320">Chi-square reference: 4 df</text><text x="398" y="210">→</text><text x="803" y="210">→</text><text x="600" y="405">Question: how uncertain is our estimate of method repeatability?</text><text x="600" y="448">The random quantity is a variance estimate, not an individual concentration.</text></g>
